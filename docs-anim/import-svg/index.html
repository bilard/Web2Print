<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<style>
  :root{
    --bg:#0F0F0F; --surface:#141414; --elev:#1A1A1A;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --ink:#F2F2F2; --mut:rgba(255,255,255,.46);
    --indigo:#6366F1; --violet:#A78BFA; --amber:#FBBF24; --sky:#38BDF8;
    --pink:#F472B6; --emerald:#34D399; --teal:#2DD4BF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [data-composition-id="import-svg-demo"]{width:1920px;height:1080px;position:relative;background:var(--bg);font-family:Inter, sans-serif;color:var(--ink);overflow:hidden}
  .scene{position:absolute;inset:0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .scene .glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 8%,rgba(99,102,241,.16),transparent 60%);pointer-events:none}

  /* Fenêtre app */
  .win{width:1500px;border:1px solid var(--line2);border-radius:20px;background:var(--surface);overflow:hidden;box-shadow:0 60px 130px -50px rgba(0,0,0,.9)}
  .winbar{height:58px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#101010;border-bottom:1px solid var(--line)}
  .dots{display:flex;gap:9px}.dots i{width:14px;height:14px;border-radius:50%}
  .wt{font-family:"JetBrains Mono",monospace;font-size:19px;color:var(--mut)}
  .wbody{padding:30px;min-height:600px}

  .sv-grid{display:grid;grid-template-columns:1fr 400px;gap:30px;align-items:start}

  /* Scène de gauche : le logo SVG sur poster */
  .sv-stage{position:relative;border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle at 50% 36%,rgba(99,102,241,.07),transparent 62%),#0c0c0c;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:30px 30px;min-height:548px;display:grid;place-items:center;overflow:hidden}
  .sv-poster{width:430px;height:430px;background:#fff;border-radius:16px;position:relative;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);display:grid;place-items:center}
  .sv-logo{width:300px;height:300px;display:block}

  /* Panneau Calques (droite) */
  .sv-panel{border:1px solid var(--line);border-radius:16px;background:var(--elev);overflow:hidden}
  .sv-ph{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);font-size:21px;font-weight:700}
  .sv-ph .pi{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;background:rgba(99,102,241,.18);color:var(--violet)}
  .sv-ph .pi svg{width:21px;height:21px}
  .sv-note{display:flex;align-items:center;gap:10px;margin:16px 22px 6px;font-family:"JetBrains Mono",monospace;font-size:15px;color:var(--mut)}
  .sv-note i{width:9px;height:9px;border-radius:50%;background:var(--emerald)}
  .lr{display:flex;align-items:center;gap:14px;padding:15px 22px;border-top:1px solid var(--line);font-size:21px}
  .lr .sw{width:22px;height:22px;border-radius:6px;flex:0 0 auto;border:1px solid rgba(255,255,255,.18)}
  .lr .nm{font-weight:600}
  .lr .nm small{display:block;font-size:14px;color:var(--mut);font-weight:400;font-family:"JetBrains Mono",monospace;margin-top:2px}
  .lr .ed{margin-left:auto;font-size:14px;font-family:"JetBrains Mono",monospace;color:var(--mut);border:1px solid var(--line2);border-radius:7px;padding:5px 11px}
  .sv-foot{margin:6px 22px 20px;font-size:16px;color:var(--mut);line-height:1.5}
  .sv-foot b{color:var(--ink)}
</style>
</head>
<body>
<div data-composition-id="import-svg-demo" data-start="0" data-duration="9" data-width="1920" data-height="1080">

  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="ic-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4.9L12 12 3 6.9 12 2z"/><path d="m3 12 9 4.9L21 12"/><path d="m3 17 9 4.9L21 17"/></symbol>
    <symbol id="ic-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></symbol>
    <symbol id="ic-poly" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 21 9.5 17.5 20h-11L3 9.5z"/></symbol>
    <symbol id="ic-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20 20 4"/></symbol>
    <symbol id="ic-type" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2"/><path d="M9 19h6"/><path d="M12 5v14"/></symbol>
    <symbol id="ic-droplet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7 6.3 9a8 8 0 1 0 11.4 0z"/></symbol>
  </svg>

  <div id="s1" class="scene">
    <div class="glow"></div>
    <div class="win">
      <div class="winbar">
        <span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span>
        <span class="wt">Importer SVG — calques vectoriels</span>
      </div>
      <div class="wbody">
        <div class="sv-grid">

          <div class="sv-stage">
            <div class="sv-poster">
              <svg class="sv-logo" viewBox="0 0 300 300">
                <circle id="sh-circle" cx="150" cy="120" r="78" fill="none" stroke="#6366F1" stroke-width="14"/>
                <path id="sh-poly" d="M150 70 198 150 102 150z" fill="#FBBF24"/>
                <path id="sh-line" d="M70 232 230 232" stroke="#38BDF8" stroke-width="13" stroke-linecap="round"/>
                <text id="sh-text" x="150" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="38" fill="#0f172a">IBS</text>
              </svg>
            </div>
          </div>

          <div class="sv-panel">
            <div class="sv-ph"><span class="pi"><svg><use href="#ic-layers"/></svg></span>Calques</div>
            <div class="sv-note" id="note"><i></i> SVG chargé · 4 entités vectorielles</div>

            <div class="lr" id="l-circle"><span class="sw" id="sw-circle" style="background:#6366F1"></span><span class="nm">Cercle<small>contour</small></span><span class="ed">vectoriel</span></div>
            <div class="lr" id="l-poly"><span class="sw" style="background:#FBBF24"></span><span class="nm">Polygone<small>triangle</small></span><span class="ed">vectoriel</span></div>
            <div class="lr" id="l-line"><span class="sw" style="background:#38BDF8"></span><span class="nm">Trait<small>ligne</small></span><span class="ed">vectoriel</span></div>
            <div class="lr" id="l-text"><span class="sw" style="background:#0f172a"></span><span class="nm">Texte<small>« IBS »</small></span><span class="ed">vectoriel</span></div>

            <div class="sv-foot">Chaque forme reste <b>vectorielle et éditable</b> : déplace, redimensionne ou <b>recolore</b> un calque directement.</div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* Entrée */
    tl.from("#s1", { opacity: 0, duration: 0.5 }, 0);
    tl.from("#s1 .sv-poster", { y: 26, opacity: 0, scale: 0.96, duration: 0.55, ease: "power3.out" }, 0.5);
    tl.from("#s1 .sv-panel", { y: 24, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.65);

    /* Le logo se compose : les formes apparaissent en stagger */
    tl.set("#s1 .sv-logo > *", { opacity: 0, transformOrigin: "50% 50%" }, 0);
    tl.to("#sh-circle", { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.1);
    tl.to("#sh-poly", { opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, 1.35);
    tl.fromTo("#sh-poly", { scale: 0.8 }, { scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 1.35);
    tl.to("#sh-line", { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.6);
    tl.to("#sh-text", { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.85);

    /* La note + les calques se peuplent */
    tl.from("#note", { opacity: 0, y: -12, duration: 0.4, ease: "power2.out" }, 2.1);
    tl.from("#l-circle", { opacity: 0, duration: 0.4, ease: "power2.out" }, 2.3);
    tl.from("#l-poly", { opacity: 0, duration: 0.4, ease: "power2.out" }, 2.5);
    tl.from("#l-line", { opacity: 0, duration: 0.4, ease: "power2.out" }, 2.7);
    tl.from("#l-text", { opacity: 0, duration: 0.4, ease: "power2.out" }, 2.9);
    tl.from("#s1 .sv-foot", { opacity: 0, y: 14, duration: 0.45, ease: "power2.out" }, 3.2);

    /* Sélection du calque Cercle (surbrillance) puis recoloration indigo → teal */
    tl.fromTo("#l-circle", { backgroundColor: "rgba(99,102,241,0)" }, { backgroundColor: "rgba(99,102,241,.14)", duration: 0.4, ease: "sine.inOut" }, 4.2);
    tl.to("#sh-circle", { attr: { stroke: "#2DD4BF" }, duration: 0.7, ease: "power2.inOut" }, 5.0);
    tl.to("#sw-circle", { backgroundColor: "#2DD4BF", duration: 0.7, ease: "power2.inOut" }, 5.0);
    tl.fromTo("#l-circle", { boxShadow: "0 0 0 0 rgba(45,212,191,0)" }, { boxShadow: "inset 0 0 0 1px rgba(45,212,191,.5)", duration: 0.45, yoyo: true, repeat: 1, ease: "sine.inOut" }, 5.0);

    /* Sortie douce pour une boucle propre */
    tl.to("#s1", { opacity: 0, duration: 0.45, ease: "power2.in" }, 8.4);

    window.__timelines["import-svg-demo"] = tl;
  </script>
</div>
</body>
</html>
