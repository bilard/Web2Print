<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<style>
  :root{
    --bg:#0F0F0F; --surface:#141414; --elev:#1A1A1A;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --ink:#F2F2F2; --mut:rgba(255,255,255,.46);
    --indigo:#6366F1; --violet:#A78BFA; --amber:#FBBF24; --sky:#38BDF8;
    --pink:#F472B6; --emerald:#34D399; --teal:#2DD4BF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [data-composition-id="workflow-demo"]{width:1920px;height:1080px;position:relative;background:var(--bg);font-family:Inter, sans-serif;color:var(--ink);overflow:hidden}
  .scene{position:absolute;inset:0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .scene .glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 8%,rgba(99,102,241,.16),transparent 60%);pointer-events:none}
  .cap{position:absolute;top:64px;left:96px;right:96px}
  .cap .t{font-size:32px;font-weight:800;letter-spacing:.02em}
  .cap .t .n{font-family:"JetBrains Mono",monospace;color:var(--indigo);margin-right:16px}
  .cap small{display:block;font-size:23px;font-weight:400;color:var(--mut);margin-top:9px}

  /* Fenêtre app */
  .win{width:1500px;border:1px solid var(--line2);border-radius:20px;background:var(--surface);overflow:hidden;box-shadow:0 60px 130px -50px rgba(0,0,0,.9)}
  .winbar{height:58px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#101010;border-bottom:1px solid var(--line)}
  .dots{display:flex;gap:9px}.dots i{width:14px;height:14px;border-radius:50%}
  .wt{font-family:"JetBrains Mono",monospace;font-size:19px;color:var(--mut)}
  .wact{margin-left:auto;display:flex;gap:10px}
  .wpill{font-size:17px;font-weight:600;padding:8px 16px;border-radius:9px}
  .wbody{padding:30px;min-height:600px}

  /* Curseur + clic */
  .cursor{position:absolute;width:30px;height:30px;z-index:30;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));top:0;left:0}
  .click-ring{position:absolute;width:54px;height:54px;border-radius:50%;border:3px solid var(--indigo);z-index:29;pointer-events:none;top:0;left:0;margin:-27px 0 0 -27px;opacity:0}

  /* SCRAPER : page web source → PIM/DAM */
  .sc-url{display:flex;align-items:center;gap:16px;background:var(--elev);border:1px solid var(--line);border-radius:14px;padding:16px 22px;margin-bottom:22px}
  .sc-url .u{font-family:"JetBrains Mono",monospace;font-size:23px;color:var(--mut)}
  .sc-url .go{margin-left:auto;font-size:21px;font-weight:700;color:#fff;background:var(--indigo);padding:11px 24px;border-radius:11px}
  .sc-cols{display:grid;grid-template-columns:1fr 124px 1fr;gap:16px;align-items:start}
  /* page web (source) */
  .webpage{position:relative;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:#fff;color:#111}
  .scanbeam{position:absolute;left:0;right:0;top:0;height:70px;z-index:5;background:linear-gradient(180deg,transparent,rgba(99,102,241,.5),transparent);pointer-events:none;opacity:0}
  .wp-bar{height:42px;background:#e9eef3;display:flex;align-items:center;gap:10px;padding:0 16px}
  .wp-bar .d{width:11px;height:11px;border-radius:50%;background:#c3ccd6}
  .wp-bar .addr{margin-left:8px;font-family:"JetBrains Mono",monospace;font-size:15px;color:#5b6470;background:#fff;border-radius:7px;padding:6px 12px;flex:1}
  .wp-in{padding:22px}
  .wp-img{position:relative;height:176px;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:14px}
  .wp-title{font-size:27px;font-weight:800;color:#0f172a;margin-bottom:9px}
  .wp-price{font-size:33px;font-weight:800;color:#dc2626;margin-bottom:15px;display:flex;align-items:baseline}
  .wp-specs{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .wp-specs span{font-size:18px;color:#475569}
  .wp-cart{display:inline-block;font-size:18px;font-weight:700;color:#fff;background:#2563eb;padding:11px 22px;border-radius:9px}
  .sc-mid{display:flex;flex-direction:column;justify-content:space-around;align-items:center;gap:30px}
  .rt{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--mut)}
  .rt b{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.05em}
  .rt svg{width:36px;height:36px}
  .sc-dest{display:flex;flex-direction:column;gap:16px}
  .card{border:1px solid var(--line);border-radius:14px;background:var(--elev);overflow:hidden}
  .card .ch{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:20px;font-weight:600}
  .card .ch .cdot{width:12px;height:12px;flex:0 0 12px;border-radius:4px}
  .kv-row{display:flex;justify-content:space-between;padding:13px 20px;border-bottom:1px solid var(--line);font-size:21px}
  .kv-row:last-child{border-bottom:0}
  .kv-row .k{font-family:"JetBrains Mono",monospace;font-size:16px;color:var(--mut);text-transform:uppercase}
  .kv-row .val{font-variant-numeric:tabular-nums}
  .thumbs{display:flex;gap:11px;padding:18px;flex-wrap:wrap}
  .thumb{width:122px;height:122px;border-radius:9px;flex:0 0 122px;overflow:hidden;border:1px solid var(--line)}

  /* Photo produit réutilisable (studio) */
  .shot{position:relative;display:block;width:100%;height:100%;background:radial-gradient(ellipse 78% 64% at 50% 38%,#fff,#eef2f7 66%,#dde5ee);overflow:hidden}
  .shot::before{content:"";position:absolute;left:26%;right:26%;bottom:12%;height:7%;border-radius:50%;background:radial-gradient(ellipse,rgba(15,23,42,.24),transparent 72%)}
  .shot .drill{position:absolute;inset:0;width:100%;height:100%;display:block}
  .shot.v2 .drill{transform:rotate(-8deg) scale(1.05);transform-origin:50% 46%}
  .shot.v3 .drill{transform:scale(1.85) translate(5%,-2%);transform-origin:64% 42%}
  .shot.v4{background:radial-gradient(ellipse 78% 64% at 50% 38%,#eaf2ff,#dbeafe 64%,#bcd7fb)}
  .shot.v4 .drill{transform:rotate(7deg) scale(.95)}
  /* habillage e-commerce de la page source */
  .wp-crumb{font-size:13px;color:#94a3b8;font-weight:600;margin-bottom:11px}
  .wp-crumb b{color:#2563eb}
  .wp-tag{position:absolute;top:11px;left:11px;background:#dc2626;color:#fff;font-size:13px;font-weight:800;padding:3px 9px;border-radius:6px;box-shadow:0 4px 10px -3px rgba(220,38,38,.6)}
  .wp-rate{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .wp-rate .stars{color:#f59e0b;font-size:18px;letter-spacing:1px}
  .wp-rate .rev{font-size:14px;color:#64748b}
  .wp-old{font-size:18px;color:#94a3b8;font-weight:600;text-decoration:line-through;margin-left:10px}
  .wp-row{display:flex;align-items:center;gap:16px;margin-top:2px}
  .wp-stock{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;color:#16a34a}
  .wp-stock i{width:9px;height:9px;border-radius:50%;background:#16a34a}

  /* IMPORTER */
  .fcards{display:flex;gap:20px;margin-bottom:30px}
  .fcard{flex:1;border:1px solid var(--line);border-radius:16px;background:var(--elev);padding:24px 20px;display:flex;flex-direction:column;gap:12px;position:relative}
  .fcard.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(251,191,36,.4)}
  .fcard .fi{width:50px;height:50px;border-radius:12px;display:grid;place-items:center}
  .fcard .fi svg{width:26px;height:26px}
  .fcard b{font-family:"JetBrains Mono",monospace;font-size:23px}
  .fcard span{font-size:17px;color:var(--mut)}
  .imp-res{display:flex;align-items:center;gap:30px;border:1px solid var(--line);border-radius:16px;background:var(--elev);padding:24px}
  .imp-poster{flex:0 0 auto;width:158px;aspect-ratio:50/68;background:#fff;border-radius:11px;position:relative;overflow:hidden;outline:2px solid var(--amber);outline-offset:4px;box-shadow:0 20px 44px -20px rgba(0,0,0,.75)}
  .imp-poster .shot{position:absolute;inset:8% 10% 46%;width:auto;height:auto;border-radius:7px}
  .imp-poster .ip-tag{position:absolute;bottom:21%;left:10%;font-size:16px;font-weight:800;color:#3730a3}
  .imp-poster .ip-price{position:absolute;bottom:8%;left:10%;background:#facc15;color:#dc2626;font-weight:800;font-size:17px;padding:3px 8px;border-radius:5px}
  .imp-poster .ip-cut{position:absolute;border:1.5px dashed rgba(99,102,241,.55);border-radius:5px}
  .imp-res .arrow{color:var(--amber)}.imp-res .arrow svg{width:38px;height:38px}
  .layers{display:flex;flex-direction:column;gap:11px;flex:1}
  .layers .lr{display:flex;align-items:center;gap:14px;font-size:21px}
  .layers .lr .sw{width:15px;height:15px;border-radius:5px}
  .layers .lr .ed{margin-left:auto;font-size:15px;font-family:"JetBrains Mono",monospace;color:var(--emerald);border:1px solid rgba(52,211,153,.4);border-radius:6px;padding:3px 9px}

  /* Éditeur (MODIFIER) */
  .editor{display:grid;grid-template-columns:70px 1fr 360px;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:560px}
  .etools{background:#101010;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0}
  .etools i{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:var(--mut)}
  .etools i.on{background:rgba(99,102,241,.18);color:#c7c4ff}.etools i svg{width:24px;height:24px}
  .ecanvas{position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(99,102,241,.07),transparent 60%),#0c0c0c;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:30px 30px}
  .poster{width:320px;aspect-ratio:50/72;background:#fff;border-radius:16px;position:relative;overflow:hidden;outline:3px solid var(--indigo);outline-offset:5px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
  .poster .pimg{position:absolute;inset:9% 11% 50%;border-radius:9px;overflow:hidden}
  .poster .pbadge{position:absolute;top:8%;right:9%;width:66px;height:66px;border-radius:50%;background:#ef4444;color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center}
  .poster .pprice{position:absolute;top:50%;left:11%;width:130px;height:54px}
  .poster .pv{position:absolute;inset:0;background:#facc15;color:#dc2626;font-weight:800;font-size:34px;padding:7px 11px;border-radius:9px;display:inline-block;width:max-content}
  .poster .pv small{font-size:17px;vertical-align:super}
  .poster .pv2{opacity:0}
  .poster .ptitle{position:absolute;bottom:13%;left:11%;font-size:26px;font-weight:800;color:#3730a3;line-height:1.05}
  .poster .ph{position:absolute;width:16px;height:16px;border:2px solid var(--indigo);border-radius:3px;background:#fff;opacity:0}
  .poster .ph1{top:-8px;left:-8px}.poster .ph2{top:-8px;right:-8px}.poster .ph3{bottom:-8px;left:-8px}.poster .ph4{bottom:-8px;right:-8px}
  .editlabel{position:absolute;z-index:25;font-size:18px;font-weight:700;color:#fff;background:var(--indigo);padding:8px 14px;border-radius:10px;opacity:0;box-shadow:0 8px 20px -6px rgba(99,102,241,.7);white-space:nowrap}
  .epanel{background:#101010;border-left:1px solid var(--line);padding:22px}
  .ep-h{font-family:"JetBrains Mono",monospace;font-size:16px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;margin:22px 0 13px}
  .ep-h:first-child{margin-top:0}
  .ep-lay{display:flex;align-items:center;gap:12px;font-size:19px;color:var(--mut);padding:10px 11px;border-radius:8px;margin-bottom:5px}
  .ep-lay.on{background:rgba(99,102,241,.16);color:#d8d6ff}
  .ep-lay .sw{width:14px;height:14px;border-radius:4px}
  .ep-sw{display:flex;gap:10px;margin-top:6px}
  .ep-sw i{width:34px;height:34px;border-radius:9px;border:2px solid transparent}
  .ep-sw i.pick{border-color:#fff}

  /* CONNECTER */
  .db{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
  .dtable{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--elev);font-size:21px}
  .dtable .tr{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .dtable .tr:last-child{border-bottom:0}
  .dtable .tr.th{background:#101010;color:var(--mut);font-family:"JetBrains Mono",monospace;font-size:15px;text-transform:uppercase}
  .dtable .tr .num{text-align:right;font-variant-numeric:tabular-nums}
  .dtable .tr.hl{background:rgba(99,102,241,.12)}
  .bindwrap{display:flex;flex-direction:column;align-items:center;gap:22px}
  .bindchips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .bindchips i{font-family:"JetBrains Mono",monospace;font-size:19px;color:var(--sky);border:1px solid rgba(56,189,248,.4);background:rgba(56,189,248,.12);border-radius:9px;padding:8px 14px;font-style:normal}
  .variants{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;width:100%}
  .variants i{height:80px;border-radius:8px;background:#fbfcfe;outline:1px solid rgba(99,102,241,.3);position:relative;overflow:hidden;box-shadow:0 5px 13px -7px rgba(0,0,0,.55)}
  .variants i::before{content:"";position:absolute;left:10%;right:10%;top:10%;height:44%;border-radius:4px;background:radial-gradient(ellipse 82% 72% at 50% 36%,#eff6ff,#93c5fd 68%,#2563eb)}
  .variants i::after{content:"";position:absolute;left:10%;bottom:13%;width:44%;height:15%;border-radius:3px;background:#facc15}
  .variants i:nth-child(3n)::before{background:radial-gradient(ellipse 82% 72% at 50% 36%,#f0fdfa,#5eead4 68%,#0d9488)}
  .variants i:nth-child(3n)::after{background:#fb7185}
  .variants i:nth-child(5n)::before{background:radial-gradient(ellipse 82% 72% at 50% 36%,#faf5ff,#c4b5fd 68%,#7c3aed)}
  .vcount{font-size:24px;color:var(--mut)}.vcount b{font-size:42px;color:var(--ink);font-weight:800}

  /* EXPORTER */
  .exp{display:flex;flex-direction:column;align-items:center;gap:40px;padding:20px 0}
  .exp-src{width:190px;aspect-ratio:50/68;background:#fff;border-radius:14px;position:relative;overflow:hidden;outline:3px solid var(--indigo);outline-offset:5px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
  .exp-src .pimg{position:absolute;inset:11% 13% 48%;border-radius:7px;overflow:hidden}
  .exp-src .pprice{position:absolute;bottom:14%;left:13%;background:#facc15;color:#dc2626;font-weight:800;font-size:21px;padding:5px 9px;border-radius:6px}
  .channels{display:flex;gap:26px}
  .chan{display:flex;flex-direction:column;align-items:center;gap:13px;width:175px;position:relative}
  .chan .ic{width:94px;height:94px;border-radius:22px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--elev)}
  .chan .ic svg{width:40px;height:40px}
  .chan b{font-size:21px;font-weight:600}.chan span{font-size:16px;color:var(--mut)}
  .chan .done{position:absolute;top:-10px;right:30px;width:34px;height:34px;border-radius:50%;background:var(--emerald);color:#06281b;display:grid;place-items:center;opacity:0}
  .chan .done svg{width:20px;height:20px}

  /* WORKFLOWS (Zapier) */
  .wf-canvas{position:relative;width:100%;height:450px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(circle at 50% 26%,rgba(99,102,241,.07),transparent 58%),#0b0b0e}
  .wf-canvas::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.4px,transparent 1.4px);background-size:28px 28px;opacity:.55}
  .wf-wires{position:absolute;top:0;left:0;pointer-events:none;z-index:1;overflow:visible}
  .wf-wires .wire{fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 6px)}
  .wf-wires .wpulse{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:12 100;stroke-dashoffset:112;opacity:0;filter:drop-shadow(0 0 9px)}
  .wf-wires .ahead{stroke:none;fill:currentColor;filter:drop-shadow(0 0 5px)}
  .wf-node{position:absolute;width:224px;height:104px;border:1px solid var(--line2);border-radius:16px;background:linear-gradient(180deg,#1d1d25,#141418);padding:0 22px;display:flex;flex-direction:column;justify-content:center;gap:9px;z-index:2;box-shadow:0 20px 44px -24px #000,0 0 30px -16px var(--accent,#6366f1)}
  .wf-node .nh{display:flex;align-items:center;gap:13px}
  .wf-node .ni{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;flex-shrink:0;box-shadow:0 6px 16px -5px var(--accent,#6366f1)}
  .wf-node .ni svg{width:23px;height:23px}
  .wf-node b{font-size:19px}
  .wf-node span{font-size:14px;color:var(--mut)}
  .wf-node .tag{position:absolute;top:-11px;left:16px;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent);background:#0b0b0e;border:1px solid var(--accent);border-radius:6px;padding:2px 9px;z-index:3}
  .wf-node::before,.wf-node::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#0b0b0e;border:3px solid var(--accent,#6366f1);transform:translateY(-50%);box-shadow:0 0 11px -1px var(--accent,#6366f1);z-index:3}
  .wf-node::before{left:-7px}
  .wf-node::after{right:-7px}
  .wf-run{display:inline-flex;align-items:center;gap:10px;margin:24px auto 0;font-size:19px;font-weight:700;color:#fff;background:var(--indigo);padding:13px 26px;border-radius:12px;box-shadow:0 0 34px -8px rgba(99,102,241,.7)}
  .wf-run svg{width:18px;height:18px}

  /* TELEGRAM */
  .tg{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding:14px 0;min-height:540px}
  .tg-msg{max-width:80%;padding:16px 22px;border-radius:20px;font-size:21px;line-height:1.4}
  .tg-msg.me{align-self:flex-end;background:var(--indigo);color:#fff;border-bottom-right-radius:7px}
  .tg-msg.me code{font-family:"JetBrains Mono",monospace;font-size:.92em;background:rgba(255,255,255,.18);padding:2px 7px;border-radius:5px}
  .tg-msg.bot{align-self:flex-start;background:var(--elev);border:1px solid var(--line);border-bottom-left-radius:7px}
  .tg-file{align-self:flex-start;display:flex;align-items:center;gap:16px;background:var(--elev);border:1px solid var(--line2);border-radius:16px;padding:16px 20px;min-width:420px}
  .tg-file .fi{width:52px;height:52px;border-radius:12px;background:rgba(99,102,241,.18);color:var(--indigo);display:grid;place-items:center;flex-shrink:0}
  .tg-file .fi svg{width:26px;height:26px}
  .tg-file b{font-size:20px;display:block}.tg-file .meta{font-size:15px;color:var(--mut)}
  .tg-file .dl{margin-left:auto;color:var(--indigo)}.tg-file .dl svg{width:26px;height:26px}
  .tg-bar{display:flex;gap:12px;align-items:center;margin-top:10px;background:var(--elev);border:1px solid var(--line);border-radius:13px;padding:13px 18px}
  .tg-bar .ph{flex:1;font-size:18px;color:var(--mut)}
  .tg-bar .send{width:44px;height:44px;border-radius:11px;background:var(--indigo);display:grid;place-items:center;color:#fff}
  .tg-bar .send svg{width:22px;height:22px}

  /* 08 — MAPPING (capture visuelle sur le site fournisseur) */
  .mp-stage{position:relative;min-height:600px;border-radius:0;overflow:hidden}
  .mp-page{position:absolute;inset:0;background:#fff;color:#0f172a;padding:24px 32px}
  .mp-crumb{font-size:15px;color:#94a3b8;font-weight:600;margin-bottom:12px}
  .mp-ptitle{font-size:30px;font-weight:800;margin-bottom:16px}
  .mp-prow{display:flex;gap:28px}
  .mp-pimg{width:300px;height:206px;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;flex:0 0 auto}
  .mp-pdesc{flex:1;font-size:18px;line-height:1.62;color:#334155}
  .mp-scrim{position:absolute;inset:0;background:rgba(8,8,12,.66);z-index:4}
  .mp-hl{position:absolute;left:362px;top:118px;width:760px;height:150px;border:2px dashed #818cf8;border-radius:10px;background:rgba(99,102,241,.16);z-index:5;box-shadow:0 0 40px -4px rgba(99,102,241,.7)}
  .mp-modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:780px;background:#141418;border:1px solid var(--line2);border-radius:18px;box-shadow:0 60px 130px -40px #000;padding:26px 28px;z-index:10}
  .mp-modal h4{font-size:25px;font-weight:800;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
  .mp-modal h4 .x{color:var(--mut);font-weight:400}
  .mp-meta{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:18px;line-height:1.55}
  .mp-meta .k{color:var(--mut)}.mp-meta b{font-family:"JetBrains Mono",monospace;color:var(--ink)}
  .mp-sel-l{font-size:15px;color:var(--mut);margin-bottom:8px}
  .mp-sel{font-family:"JetBrains Mono",monospace;font-size:19px;color:#c7c4ff;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.55);border-radius:10px;padding:12px 15px;margin-bottom:20px}
  .mp-fl{font-size:15px;color:var(--mut);margin-bottom:11px}
  .mp-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .mp-field{font-size:16px;text-align:center;padding:12px 8px;border:1px solid var(--line2);border-radius:11px;background:var(--elev);color:var(--ink)}
  .mp-field.on{border-color:var(--emerald);background:rgba(52,211,153,.18);color:#bbf7d0;box-shadow:0 0 24px -6px var(--emerald)}

  /* 09 — TAXONOMIE */
  .tx-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:start}
  .tx-tree{border:1px solid var(--line);border-radius:16px;background:var(--elev);padding:16px 12px}
  .tx-node{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-size:21px}
  .tx-node .chev{width:14px;color:var(--mut);flex:0 0 14px}
  .tx-node .fi{display:grid;place-items:center;flex:0 0 auto}.tx-node .fi svg{width:21px;height:21px;display:block}
  .tx-node .ct{margin-left:auto;font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:2px 12px}
  .tx-node.l2{padding-left:40px;font-size:20px}.tx-node.l3{padding-left:68px;font-size:19px}
  .tx-node.sel{background:rgba(99,102,241,.16);box-shadow:inset 3px 0 0 var(--indigo)}
  .tx-side{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:26px}
  .tx-drop{font-family:"JetBrains Mono",monospace;font-size:15px;color:var(--mut);letter-spacing:.05em}
  .tx-prod{width:188px;border:1px solid var(--line2);border-radius:14px;background:var(--surface2);padding:12px;display:flex;align-items:center;gap:13px;box-shadow:0 18px 40px -18px #000}

  .tx-prod b{font-size:17px;display:block}.tx-prod span{font-size:13px;color:var(--mut)}
  .tx-arrow{color:var(--emerald)}.tx-arrow svg{width:34px;height:34px;display:block}

  /* 10 — ANIMATION (génération IA) */
  .an-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:28px;align-items:start}
  .an-label{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.07em;color:var(--mut);margin:0 0 10px}
  .an-seg{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}
  .an-chip{font-size:16px;padding:9px 17px;border:1px solid var(--line2);border-radius:10px;color:var(--mut)}
  .an-chip.on{border-color:var(--indigo);background:rgba(99,102,241,.18);color:#d8d6ff;box-shadow:0 0 20px -7px var(--indigo)}
  .an-brief{border:1px solid var(--line);border-radius:13px;background:var(--surface2);padding:16px 18px;font-size:19px;line-height:1.5;min-height:104px;color:var(--ink);position:relative;overflow:hidden}
  .an-brief .typed{display:inline-block;overflow:hidden;white-space:normal}
  .an-gen{margin-top:20px;text-align:center;font-size:19px;font-weight:700;color:#fff;background:var(--indigo);padding:15px;border-radius:13px;box-shadow:0 0 34px -8px rgba(99,102,241,.7)}
  .an-gen svg{width:19px;height:19px;vertical-align:-3px;margin-right:8px}
  .an-lib{border:1px solid var(--line);border-radius:16px;background:var(--elev);padding:16px 16px 6px}
  .an-lib h5{font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.06em;color:var(--mut);display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .an-card{border:1px solid var(--line2);border-radius:12px;background:var(--surface2);padding:11px;margin-bottom:12px;display:flex;gap:13px;align-items:center}
  .an-card.fresh{border-color:var(--violet);box-shadow:0 0 26px -8px var(--violet)}
  .an-thumb{width:96px;height:56px;border-radius:8px;flex:0 0 auto;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
  .an-thumb svg{width:22px;height:22px;position:relative;z-index:1}
  .an-card b{font-size:16px;display:block;line-height:1.25}.an-card span{font-size:13px;color:var(--mut)}

  /* 11 — ASSISTANT IA (chat multi-LLM) */
  .ch-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:600px;gap:30px;padding:0 60px}
  .ch-title{font-size:56px;font-weight:800;text-align:center;letter-spacing:-.01em}
  .ch-box{width:940px;max-width:100%;border:1px solid var(--line2);border-radius:18px;background:var(--surface2);padding:22px 24px;position:relative}
  .ch-ph{font-size:22px;color:var(--mut);margin-bottom:44px}
  .ch-bar{display:flex;align-items:center;gap:14px}
  .ch-plus{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--mut);font-size:24px}
  .ch-model{margin-left:auto;display:flex;align-items:center;gap:11px;font-size:19px;font-weight:700;border:1px solid var(--line2);border-radius:11px;padding:11px 17px;background:var(--elev)}
  .ch-model .prov{color:var(--mut);font-weight:500}.ch-model .cv{color:var(--mut)}
  .ch-drop{position:absolute;right:58px;bottom:84px;width:340px;background:#16161f;border:1px solid var(--line2);border-radius:14px;box-shadow:0 50px 120px -30px #000;padding:8px;z-index:10}
  .ch-opt{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:10px;font-size:19px}
  .ch-opt .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .ch-opt .pv{margin-left:auto;font-size:14px;color:var(--mut)}
  .ch-opt.on{background:rgba(99,102,241,.18)}
  .ch-chips{display:flex;gap:13px;flex-wrap:wrap;justify-content:center}
  .ch-chip{font-size:18px;padding:11px 21px;border:1px solid var(--line2);border-radius:100px;color:var(--ink);display:flex;align-items:center;gap:9px}
  .ch-chip svg{width:18px;height:18px;color:var(--mut)}

  /* 12 — UTILISATEURS & RÔLES */
  .us-tabs{display:flex;gap:11px;margin-bottom:18px}
  .us-tab{font-size:17px;padding:10px 19px;border-radius:10px;border:1px solid var(--line2);color:var(--mut);display:flex;gap:9px;align-items:center}
  .us-tab.on{background:var(--elev);color:var(--ink)}.us-tab svg{width:18px;height:18px}
  .us-row{display:flex;align-items:center;gap:15px;border:1px solid var(--line);border-radius:14px;background:var(--elev);padding:14px 18px;margin-bottom:14px}
  .us-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;flex:0 0 auto}
  .us-name{font-size:21px;font-weight:700;display:flex;align-items:center;gap:11px}
  .us-badge{font-size:13px;font-weight:700;padding:3px 11px;border-radius:7px}
  .us-mail{font-size:14px;color:var(--mut);margin-top:3px}
  .us-role{margin-left:auto;font-size:16px;border:1px solid var(--line2);border-radius:10px;padding:9px 15px;color:var(--ink);display:flex;gap:10px;align-items:center}
  .us-cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .us-cat{border:1px solid var(--line);border-radius:12px;background:var(--elev);padding:13px 16px}
  .us-cat .ch-row{display:flex;align-items:center;gap:13px;font-size:19px;font-weight:600}
  .us-cat .ci{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}.us-cat .ci svg{width:19px;height:19px}
  .us-cat .cc{margin-left:auto;font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:20px;padding:2px 11px}
  .us-cat.span2{grid-column:1 / -1}
  .us-perms{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
  .us-perm{font-size:15px;border:1px solid var(--line2);border-radius:9px;padding:7px 12px;display:flex;gap:9px;align-items:center;color:var(--ink)}
  .us-perm i{font-style:normal;font-weight:700}.us-perm .g{color:var(--emerald)}.us-perm .r{color:var(--mut)}
  .us-perm.granted{border-color:var(--emerald);background:rgba(52,211,153,.16);box-shadow:0 0 20px -7px var(--emerald)}

  /* 13 — CRÉATION D'IMAGE IA (Visuel IA) */
  .ig-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:30px;align-items:start}
  .ig-label{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.07em;color:var(--mut);margin:0 0 10px}
  .ig-prompt{border:1px solid var(--line);border-radius:13px;background:var(--surface2);padding:16px 18px;font-size:19px;line-height:1.5;min-height:120px;color:var(--ink);overflow:hidden}
  .ig-ref{display:flex;align-items:center;gap:13px;margin-top:18px;font-size:16px;color:var(--mut)}
  .ig-ref .rimg{width:58px;height:58px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);flex:0 0 auto}
  .ig-gen{margin-top:18px;text-align:center;font-size:19px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6366f1,#a78bfa);padding:15px;border-radius:13px;box-shadow:0 0 36px -8px #a78bfa}
  .ig-gen svg{width:19px;height:19px;vertical-align:-3px;margin-right:8px}
  .ig-results{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .ig-tile{aspect-ratio:4/3;border-radius:13px;overflow:hidden;position:relative;border:1px solid var(--line2);box-shadow:0 16px 38px -20px #000}
  .ig-tile .shot{width:100%;height:100%}
  .ig-tile.t2 .shot{background:radial-gradient(ellipse 80% 68% at 50% 36%,#eaf2ff,#bfdbfe 64%,#7cb0f5)}
  .ig-tile.t2 .drill{transform:rotate(-6deg)}
  .ig-tile.t3 .shot{background:radial-gradient(ellipse 80% 70% at 50% 36%,#243043,#0b1120 70%,#020617)}
  .ig-tile.t3 .shot::before{opacity:.45}
  .ig-tile.t3 .drill{transform:rotate(5deg)}
  .ig-tile.t4 .shot{background:radial-gradient(ellipse 80% 70% at 50% 36%,#fff7ed,#fed7aa 64%,#fb923c)}
  .ig-tile.t4 .drill{transform:rotate(8deg) scale(.97)}
  .ig-badge{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;color:#fff;background:rgba(124,108,255,.9);border-radius:7px;padding:4px 9px;display:flex;gap:6px;align-items:center;box-shadow:0 6px 16px -6px #7c6cff}
  .ig-badge svg{width:13px;height:13px}

  /* Intro / Outro */
  .center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:30px}
  .logo{display:flex;align-items:center;gap:22px}
  .logo .sq{width:84px;height:84px;border-radius:21px;background:var(--indigo);display:grid;place-items:center;box-shadow:0 0 40px -6px rgba(99,102,241,.7)}
  .logo .sq svg{width:46px;height:46px}
  .logo .wm{font-family:"JetBrains Mono",monospace;font-size:42px;font-weight:700;letter-spacing:.1em}
  .logo-img{height:158px;width:auto;display:block;filter:drop-shadow(0 14px 38px rgba(45,212,191,.28))}
  .logo-img.sm{height:118px}
  .logo-img.lg{height:248px;filter:drop-shadow(0 20px 54px rgba(45,212,191,.34))}
  .big{font-size:104px;font-weight:800;letter-spacing:-.02em;line-height:1.02}
  .big .hl{color:var(--indigo)}
  /* Mot « propulsées » en dégradé animé (position pilotée par GSAP) */
  .grad-anim{display:inline-block;background-image:linear-gradient(90deg,#6366F1,#A78BFA,#38BDF8,#2DD4BF,#A78BFA,#6366F1);background-size:220% 100%;background-position:0% 50%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  /* Bloc logo+titre remonté dans la slide intro */
  #s1 .center{transform:translateY(-74px)}
  .pills{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:1500px}
  .pill{display:inline-flex;align-items:center;font-size:22px;font-weight:600;padding:11px 21px;border:1px solid var(--line2);border-radius:100px;background:var(--surface)}
  .pill .d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:11px;vertical-align:middle}
  .pill .pic{width:20px;height:20px;margin-right:10px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  /* Bande des modules ancrée en bas de la slide intro */
  .s1-pills{position:absolute;left:0;right:0;bottom:150px;margin:0 auto;max-width:1780px;padding:0 50px;box-sizing:border-box}
  .cta{font-size:28px;font-weight:700;color:#fff;background:var(--indigo);padding:18px 36px;border-radius:14px;box-shadow:0 0 44px -8px rgba(99,102,241,.7)}
  .url-out{font-family:"JetBrains Mono",monospace;font-size:26px;color:var(--mut);letter-spacing:.06em}

  /* ===== NOUVEAUX MODULES (14–18) ===== */
  /* 14 CRÉER — formats */
  .nf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .nf-card{border:1px solid var(--line);border-radius:16px;background:var(--elev);padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
  .nf-card.sel{border-color:var(--violet);box-shadow:0 0 0 2px rgba(167,139,250,.45),0 0 40px -10px var(--violet)}
  .nf-prev{background:#fff;border-radius:6px;box-shadow:0 12px 26px -14px rgba(0,0,0,.8);position:relative;overflow:hidden}
  .nf-prev::after{content:"";position:absolute;left:14%;right:14%;top:18%;height:9px;border-radius:3px;background:#cbd5e1;box-shadow:0 22px 0 -2px #e2e8f0,0 40px 0 -3px #eef2f7}
  .nf-card b{font-size:23px;font-weight:700}
  .nf-card span{font-family:"JetBrains Mono",monospace;font-size:16px;color:var(--mut)}
  .nf-ok{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;opacity:0}
  .nf-ok svg{width:20px;height:20px}
  /* 15 ORGANISER — bibliothèque */
  .lib-wrap{display:grid;grid-template-columns:300px 1fr;gap:22px}
  .lib-side{border:1px solid var(--line);border-radius:14px;background:var(--elev);padding:14px;display:flex;flex-direction:column;gap:5px}
  .lib-item{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:10px;font-size:21px;color:var(--mut)}
  .lib-item .fi{color:var(--amber);display:grid;place-items:center}.lib-item .fi svg{width:22px;height:22px}
  .lib-item .ct{margin-left:auto;font-size:15px;font-family:"JetBrains Mono",monospace;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:2px 11px}
  .lib-item.on{background:rgba(99,102,241,.16);color:var(--ink);box-shadow:inset 3px 0 0 var(--indigo)}
  .lib-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-content:start}
  .lib-card{border:1px solid var(--line);border-radius:13px;background:var(--elev);overflow:hidden}
  .lib-thumb{aspect-ratio:5/4;position:relative;border-bottom:1px solid var(--line)}
  .lib-mini{position:absolute;inset:14% 18% 20%;background:#fff;border-radius:5px;overflow:hidden}
  .lib-mini .ip-tag{position:absolute;left:9%;bottom:10%;font-size:11px;font-weight:800;color:#dc2626;background:#facc15;padding:2px 6px;border-radius:4px}
  .lib-meta{padding:12px 15px;font-size:18px;font-weight:600}
  .lib-meta span{display:block;font-size:14px;color:var(--mut);font-weight:400;margin-top:3px}
  /* 16 MÉDIAS — DAM */
  .dam-search{display:flex;align-items:center;gap:14px;background:var(--elev);border:1px solid var(--line);border-radius:13px;padding:15px 20px;margin-bottom:18px}
  .dam-search svg{width:26px;height:26px;color:var(--mut)}
  .dam-search .q{font-family:"JetBrains Mono",monospace;font-size:22px;color:var(--ink);white-space:nowrap;overflow:hidden}
  .dam-search .cnt{margin-left:auto;font-size:18px;color:var(--mut)}
  .dam-tags{display:flex;gap:11px;margin-bottom:20px;flex-wrap:wrap}
  .dam-tag{font-size:18px;color:var(--mut);border:1px solid var(--line2);border-radius:100px;padding:8px 19px}
  .dam-tag.on{border-color:var(--pink);background:rgba(244,114,182,.16);color:#fbcfe8}
  .dam-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:15px}
  .dam-cell{aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--line);position:relative}
  .dam-cell .ig-badge{position:absolute;top:auto;right:8px;bottom:8px;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#fff;background:rgba(99,102,241,.85);padding:3px 8px;border-radius:6px;box-shadow:none}
  .dam-cell .ig-badge svg{width:12px;height:12px}
  /* 17 DONNÉES — PIM */
  .pbases{display:flex;gap:10px;margin-bottom:18px}
  .pbase{font-size:18px;color:var(--mut);padding:9px 18px;border-radius:9px;border:1px solid var(--line)}
  .pbase.on{background:var(--elev);color:var(--ink);border-color:var(--line2)}
  .ptable{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--elev)}
  .ptr{display:grid;grid-template-columns:1.6fr .9fr .9fr 1fr .9fr;gap:14px;padding:16px 22px;border-top:1px solid var(--line);font-size:21px;align-items:center}
  .ptr:first-child{border-top:0}
  .ptr.th{background:#0e0e0e;font-family:"JetBrains Mono",monospace;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
  .ptr .num{text-align:right;font-variant-numeric:tabular-nums}
  .ptr .calc{text-align:right;color:#a5b4fc;font-variant-numeric:tabular-nums}
  .ptr.th .calc{color:var(--indigo)}
  .pfx{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--indigo);border:1px solid rgba(99,102,241,.5);background:rgba(99,102,241,.16);border-radius:5px;padding:1px 6px;margin-left:8px}
  .pform{display:flex;align-items:center;gap:12px;padding:14px 22px;border-top:1px solid var(--line);background:rgba(99,102,241,.07);font-family:"JetBrains Mono",monospace;font-size:17px;color:#c7c4ff}
  .pform b{color:#a5b4fc}
  /* 18 PARAMÉTRER — réglages IA */
  .set-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .set-col{border:1px solid var(--line);border-radius:14px;background:var(--elev);padding:20px}
  .set-h{font-family:"JetBrains Mono",monospace;font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:16px}
  .set-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
  .set-row:first-of-type{border-top:0}
  .set-dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
  .set-row b{font-size:21px;font-weight:600}
  .set-row .key{font-family:"JetBrains Mono",monospace;font-size:16px;color:var(--mut);margin-left:4px}
  .set-status{margin-left:auto;font-size:16px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:7px}
  .set-status.ok{color:var(--emerald)}.set-status svg{width:18px;height:18px}
  .set-casc{display:flex;flex-direction:column;gap:11px}
  .set-step{display:flex;align-items:center;gap:13px;font-size:20px;padding:11px 15px;border:1px solid var(--line);border-radius:10px}
  .set-step .ord{font-family:"JetBrains Mono",monospace;font-size:15px;color:var(--indigo)}
  .set-step .prov{margin-left:auto;font-size:15px;color:var(--mut)}
  .set-budget{margin-top:18px}
  .set-budget .bl{display:flex;justify-content:space-between;font-size:17px;color:var(--mut);margin-bottom:9px}
  .set-bar{height:14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
  .set-bar i{display:block;height:100%;width:42%;background:linear-gradient(90deg,var(--indigo),var(--violet));border-radius:8px}
</style>

<div data-composition-id="workflow-demo" data-start="0" data-duration="9" data-width="1920" data-height="1080">

  <!-- Illustration produit réutilisable (perceuse 18V) — le héros du récit -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* S7 — workflows : graphe (entrée → étapes → sortie), câbles tracés, puis exécution avec pulse le long des fils */
    tl.from("#s7",{opacity:0,duration:.5},0);
    tl.from("#s7 .wf-node",{y:28,scale:.9,opacity:0,duration:.5,ease:"expo.out",stagger:.13},.6);
    tl.from("#s7 .wf-node .tag",{y:7,opacity:0,duration:.35,ease:"back.out(2)",stagger:.45},1.1);
    // les câbles se tracent entre les ports
    tl.to("#s7 .wire",{strokeDashoffset:0,duration:.6,ease:"power2.inOut",stagger:.13},1.0);
    tl.from("#s7 .ahead",{opacity:0,duration:.3,ease:"power2.out",stagger:.13},1.45);
    tl.from("#s7 .wf-run",{scale:.9,opacity:0,duration:.4,ease:"power3.out"},1.8);
    tl.fromTo("#wfrun",{scale:1},{scale:1.07,duration:.3,yoyo:true,repeat:1,ease:"sine.inOut"},2.15);
    // exécution : chaque node s'allume, puis un pulse file vers le suivant le long du câble
    function lite(id,col,t){tl.to(id,{boxShadow:"0 20px 44px -24px #000,0 0 42px -6px "+col,borderColor:col,duration:.34,yoyo:true,repeat:1,ease:"sine.inOut"},t);}
    function pulse(id,t){tl.set(id,{opacity:1},t);tl.fromTo(id,{strokeDashoffset:112},{strokeDashoffset:12,duration:.46,ease:"power1.inOut"},t);tl.to(id,{opacity:0,duration:.16},t+.46);}
    lite("#wn1","#38BDF8",2.4); pulse("#wpulse1",2.6);
    lite("#wn2","#34D399",2.95); pulse("#wpulse2",3.15);
    lite("#wn3","#6366F1",3.5); pulse("#wpulse3",3.7);
    lite("#wn4","#A78BFA",4.05); pulse("#wpulse4",4.25);
    lite("#wn5","#60A5FA",4.6);

    // Sortie douce pour une boucle propre
    tl.to("#s7",{opacity:0,duration:.45,ease:"power2.in"},8.4);

    window.__timelines["workflow-demo"] = tl;
  </script>
