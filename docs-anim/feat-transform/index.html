<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<style>
  :root{
    --bg:#0F0F0F; --surface:#141414; --elev:#1A1A1A; --surface2:#16161c;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --ink:#F2F2F2; --mut:rgba(255,255,255,.46);
    --indigo:#6366F1; --violet:#A78BFA; --sky:#38BDF8; --emerald:#34D399; --amber:#FBBF24;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [data-composition-id="feat-transform"]{width:1600px;height:384px;position:relative;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);overflow:hidden}
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:26px 38px}
  .glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 30% 30%,rgba(99,102,241,.16),transparent 62%);pointer-events:none}

  .fiche{position:relative;width:100%;height:100%;border:1px solid var(--line2);border-radius:22px;background:linear-gradient(180deg,#16161c,#121217);box-shadow:0 40px 90px -40px #000;display:grid;grid-template-columns:300px 60px 1fr;align-items:center;overflow:hidden;padding:22px}

  /* faisceau indigo qui balaie */
  .beam{position:absolute;top:0;bottom:0;width:220px;z-index:6;background:linear-gradient(90deg,transparent,rgba(99,102,241,.34),rgba(167,139,250,.14),transparent);pointer-events:none;opacity:0;mix-blend-mode:screen}

  /* ===== GAUCHE : image raster + quadrillage pixels ===== */
  .raster{position:relative;height:240px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse 78% 64% at 50% 42%,#fff,#eef2f7 66%,#dde5ee)}
  .raster .drill{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* overlay quadrillage de pixels */
  .pxgrid{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
    background-image:linear-gradient(rgba(99,102,241,.30) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.30) 1px,transparent 1px);
    background-size:16px 16px}
  .rlabel{position:absolute;left:0;right:0;bottom:0;z-index:4;height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1;letter-spacing:.06em;color:#475569;background:linear-gradient(180deg,transparent,rgba(255,255,255,.82));padding-bottom:8px;text-transform:uppercase}

  /* ===== MILIEU : flèche transformation ===== */
  .arrow{display:flex;align-items:center;justify-content:center;color:var(--violet);opacity:0}
  .arrow svg{width:40px;height:40px}

  /* ===== DROITE : calques vectoriels ===== */
  .vec{position:relative;height:280px}
  .vec .vlabel{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;margin-bottom:14px;opacity:0}
  .vstage{position:relative;height:236px}
  /* le tracé SVG du contour produit (se dessine) */
  .vdraw{position:absolute;left:0;top:0;width:300px;height:236px;overflow:visible}
  .vdraw path,.vdraw line{fill:none;stroke:var(--sky);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:760;stroke-dashoffset:760;filter:drop-shadow(0 0 5px rgba(56,189,248,.5))}

  /* blocs vectoriels éditables (texte + prix) */
  .vblock{position:absolute;border:1.6px solid rgba(99,102,241,.55);border-radius:7px;background:rgba(99,102,241,.07);opacity:0}
  .vblock.txt{display:flex;flex-direction:column;justify-content:center;gap:7px;padding:11px 13px}
  .vline{height:9px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.78),rgba(255,255,255,.34));transform-origin:left center;transform:scaleX(0)}
  .vline.w1{width:88%}.vline.w2{width:64%}.vline.w3{width:76%}
  .vblock.price{display:flex;align-items:center;justify-content:center}
  .vprice{font-size:30px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .vprice small{font-size:16px;vertical-align:super;margin-left:2px}

  /* poignées d'édition (carrés aux coins) */
  .vh{position:absolute;width:11px;height:11px;border:2px solid var(--indigo);border-radius:2px;background:#0F0F0F;opacity:0;z-index:5;box-shadow:0 0 8px -1px var(--indigo)}
  .vh.tl{top:-6px;left:-6px}.vh.tr{top:-6px;right:-6px}.vh.bl{bottom:-6px;left:-6px}.vh.br{bottom:-6px;right:-6px}

  /* étiquette « éditable » */
  .edit-tag{position:absolute;z-index:7;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--indigo);border-radius:7px;padding:5px 11px;white-space:nowrap;opacity:0;box-shadow:0 8px 20px -6px rgba(99,102,241,.7)}
  .edit-tag svg{width:12px;height:12px;vertical-align:-2px;margin-right:5px}
</style>
</head>
<body>
<div data-composition-id="feat-transform" data-start="0" data-duration="7" data-width="1600" data-height="384">

  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <linearGradient id="dBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc6fb"/><stop offset=".55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
      <linearGradient id="dGrip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
      <linearGradient id="dMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    </defs>
    <symbol id="ic-drill" viewBox="0 0 240 160">
      <path d="M84 90 L122 90 L114 150 L78 150 Z" fill="url(#dGrip)"/>
      <rect x="66" y="141" width="60" height="19" rx="6" fill="url(#dMetal)"/>
      <path d="M122 95 q13 3 10 18 l-10 -3 Z" fill="#0f172a"/>
      <rect x="58" y="40" width="104" height="56" rx="16" fill="url(#dBody)"/>
      <rect x="72" y="49" width="48" height="6" rx="3" fill="rgba(255,255,255,.42)"/>
      <circle cx="140" cy="68" r="8" fill="rgba(255,255,255,.32)"/>
      <circle cx="92" cy="66" r="5" fill="#fbbf24"/>
      <rect x="154" y="52" width="16" height="28" rx="4" fill="url(#dMetal)"/>
      <path d="M168 54 L196 60 L196 72 L168 78 Z" fill="url(#dMetal)"/>
      <rect x="192" y="60" width="9" height="12" rx="2" fill="#e2e8f0"/>
      <rect x="200" y="63" width="34" height="5" rx="2.5" fill="#cbd5e1"/>
    </symbol>
  </svg>

  <div class="scene" id="s1">
    <div class="glow"></div>
    <div class="fiche">
      <div class="beam" id="beam" data-layout-allow-overflow></div>

      <!-- GAUCHE : image raster + quadrillage pixels -->
      <div class="raster">
        <svg class="drill" id="drill" viewBox="0 0 240 160"><use href="#ic-drill" width="240" height="160"/></svg>
        <div class="pxgrid" id="pxgrid"></div>
        <div class="rlabel" id="rlabel">image · pixels</div>
      </div>

      <!-- MILIEU : flèche -->
      <div class="arrow" id="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></div>

      <!-- DROITE : calques vectoriels qui se dessinent -->
      <div class="vec">
        <div class="vlabel" id="vlabel">SVG · formes &amp; textes éditables</div>
        <div class="vstage">
          <!-- contour produit tracé -->
          <svg class="vdraw" viewBox="0 0 300 236" data-layout-allow-overflow>
            <path id="vpath" d="M70 150 L100 150 L94 196 L66 196 Z M58 78 L150 78 Q166 78 166 96 L166 130 Q166 142 152 142 L82 142 L70 150 M150 96 L186 88 L186 116 L150 124"/>
          </svg>

          <!-- bloc titre (lignes de texte recréées) -->
          <div class="vblock txt" id="vtitle" style="left:172px;top:6px;width:118px;height:74px" data-layout-allow-overlap>
            <span class="vline w1"></span><span class="vline w2"></span><span class="vline w3"></span>
            <span class="vh tl"></span><span class="vh tr"></span><span class="vh bl"></span><span class="vh br"></span>
          </div>

          <!-- bloc prix -->
          <div class="vblock price" id="vpriceblk" style="left:172px;top:150px;width:118px;height:62px" data-layout-allow-overlap>
            <span class="vprice">149<small>,00 €</small></span>
            <span class="vh tl"></span><span class="vh tr"></span><span class="vh bl"></span><span class="vh br"></span>
          </div>

          <!-- étiquettes « éditable » -->
          <span class="edit-tag" id="tag1" style="left:300px;top:24px" data-layout-allow-overflow><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>éditable</span>
          <span class="edit-tag" id="tag2" style="left:300px;top:160px" data-layout-allow-overflow><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>prix éditable</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Apparition de la fiche
    tl.from("#s1 .fiche", { y: 26, opacity: 0, scale: 0.985, duration: 0.55, ease: "power3.out", transformOrigin: "50% 50%" }, 0.1);

    // L'image raster apparaît, puis le quadrillage de pixels la fige
    tl.from("#drill", { opacity: 0, scale: 0.9, duration: 0.5, ease: "power2.out", transformOrigin: "52% 46%" }, 0.3);
    tl.to("#pxgrid", { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.7);
    tl.from("#rlabel", { opacity: 0, duration: 0.35 }, 0.85);

    // Le faisceau indigo balaie de gauche à droite
    tl.set("#beam", { left: "-220px", opacity: 0 }, 0);
    tl.to("#beam", { opacity: 1, duration: 0.3 }, 1.0);
    tl.to("#beam", { left: "1600px", duration: 2.6, ease: "power1.inOut" }, 1.0);
    tl.to("#beam", { opacity: 0, duration: 0.3 }, 3.4);

    // La flèche de transformation
    tl.fromTo("#arrow", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.4);

    // Label du panneau vectoriel
    tl.to("#vlabel", { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.5);

    // Le contour produit se dessine (tracé vectoriel)
    tl.to("#vpath", { strokeDashoffset: 0, duration: 1.7, ease: "power1.inOut" }, 1.6);

    // Le bloc titre apparaît : conteneur, lignes de texte recréées, poignées
    tl.to("#vtitle", { opacity: 1, duration: 0.3 }, 2.3);
    tl.to("#vtitle .vline", { scaleX: 1, duration: 0.45, ease: "power2.out", stagger: 0.12 }, 2.4);
    tl.to("#vtitle .vh", { opacity: 1, duration: 0.3, stagger: 0.04 }, 2.7);
    tl.fromTo("#tag1", { opacity: 0, scale: 0.7, y: 6 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 3.0);

    // Le bloc prix apparaît : conteneur, valeur, poignées
    tl.to("#vpriceblk", { opacity: 1, duration: 0.3 }, 3.5);
    tl.fromTo("#vpriceblk .vprice", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 3.6);
    tl.to("#vpriceblk .vh", { opacity: 1, duration: 0.3, stagger: 0.04 }, 3.9);
    tl.fromTo("#tag2", { opacity: 0, scale: 0.7, y: 6 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 4.2);

    // Pulsation douce des poignées pour signifier « manipulable »
    tl.to(".vh", { boxShadow: "0 0 16px 1px #6366F1", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.7);

    // Maintien puis fondu doux pour une sortie propre
    tl.to("#s1", { opacity: 0, duration: 0.5, ease: "power2.in" }, 6.5);

    window.__timelines["feat-transform"] = tl;
  </script>
</div>
</body>
</html>
