<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<style>
  :root{
    --bg:#0F0F0F; --surface:#141414; --elev:#1A1A1A; --surface2:#16161c;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --ink:#F2F2F2; --mut:rgba(255,255,255,.46);
    --indigo:#6366F1; --violet:#A78BFA; --sky:#38BDF8; --emerald:#34D399; --amber:#FBBF24;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [data-composition-id="feat-export"]{width:1600px;height:384px;position:relative;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);overflow:hidden}
  .scene{position:absolute;inset:0;display:flex;align-items:center;padding:26px 60px;gap:0}
  .glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 28% 50%,rgba(99,102,241,.16),transparent 62%);pointer-events:none}

  /* connecteurs 1 → N (overlay plein écran) */
  .wires{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:visible}
  .wires .wire{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px)}
  .wires .hub{fill:var(--indigo);opacity:0;filter:drop-shadow(0 0 8px var(--indigo))}

  /* poster source (gauche) */
  .src{position:relative;z-index:3;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
  .poster{position:relative;width:204px;aspect-ratio:50/68;background:#fff;border-radius:14px;overflow:hidden;outline:3px solid var(--indigo);outline-offset:5px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
  .poster .pimg{position:absolute;inset:10% 12% 46%;border-radius:8px;overflow:hidden;background:radial-gradient(ellipse 78% 64% at 50% 40%,#fff,#eef2f7 66%,#dde5ee)}
  .poster .pimg .drill{position:absolute;inset:0;width:100%;height:100%;display:block}
  .poster .ptitle{position:absolute;bottom:23%;left:18%;right:18%;font-size:16px;font-weight:800;color:#3730a3;line-height:1.05;text-align:center}
  .poster .pprice{position:absolute;bottom:8%;left:12%;background:#facc15;color:#dc2626;font-weight:800;font-size:20px;padding:4px 10px;border-radius:7px}
  .src-tag{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;letter-spacing:.08em;color:#cdc7ff;background:rgba(124,108,255,.16);border:1px solid rgba(124,108,255,.5);border-radius:100px;padding:5px 13px;white-space:nowrap}

  /* libellé central « 1 → N » */
  .one2n{position:relative;z-index:3;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 18px 0 78px;color:var(--mut);opacity:0}
  .one2n .big{font-size:34px;font-weight:800;color:var(--ink);letter-spacing:.02em;line-height:1}
  .one2n .big b{color:var(--indigo)}
  .one2n small{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.04em}

  /* grille des 4 formats (droite) */
  .grid{position:relative;z-index:3;flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;height:296px}
  .card{position:relative;display:flex;align-items:center;gap:16px;border:1px solid var(--line2);border-radius:16px;background:linear-gradient(180deg,#1d1d25,#141418);padding:0 22px;box-shadow:0 20px 44px -24px #000}
  .card .ic{width:58px;height:58px;flex:0 0 58px;border-radius:15px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--elev)}
  .card .ic svg{width:30px;height:30px}
  .card .meta b{display:block;font-size:21px;font-weight:700}
  .card .meta span{display:block;font-size:15px;color:var(--mut);font-family:"JetBrains Mono",monospace;margin-top:3px}
  .card .done{position:absolute;top:-12px;right:-12px;width:34px;height:34px;border-radius:50%;background:var(--emerald);color:#06281b;display:grid;place-items:center;opacity:0;box-shadow:0 8px 18px -5px var(--emerald)}
  .card .done svg{width:20px;height:20px}
</style>
</head>
<body>
<div data-composition-id="feat-export" data-start="0" data-duration="7" data-width="1600" data-height="384">

  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <linearGradient id="dBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc6fb"/><stop offset=".55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
      <linearGradient id="dGrip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
      <linearGradient id="dMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    </defs>
    <symbol id="ic-drill" viewBox="0 0 240 160">
      <path d="M84 90 L122 90 L114 150 L78 150 Z" fill="url(#dGrip)"/>
      <rect x="66" y="141" width="60" height="19" rx="6" fill="url(#dMetal)"/>
      <path d="M122 95 q13 3 10 18 l-10 -3 Z" fill="#0f172a"/>
      <rect x="58" y="40" width="104" height="56" rx="16" fill="url(#dBody)"/>
      <rect x="72" y="49" width="48" height="6" rx="3" fill="rgba(255,255,255,.42)"/>
      <circle cx="140" cy="68" r="8" fill="rgba(255,255,255,.32)"/>
      <circle cx="92" cy="66" r="5" fill="#fbbf24"/>
      <rect x="154" y="52" width="16" height="28" rx="4" fill="url(#dMetal)"/>
      <path d="M168 54 L196 60 L196 72 L168 78 Z" fill="url(#dMetal)"/>
      <rect x="192" y="60" width="9" height="12" rx="2" fill="#e2e8f0"/>
      <rect x="200" y="63" width="34" height="5" rx="2.5" fill="#cbd5e1"/>
    </symbol>
  </svg>

  <div class="scene" id="s1">
    <div class="glow"></div>

    <!-- connecteurs poster → 4 cartes (hub ~ x=300,y=192 ; cibles = centres-gauche des cartes) -->
    <svg class="wires" id="wires" viewBox="0 0 1600 384" preserveAspectRatio="none" data-layout-allow-overflow data-layout-allow-overlap>
      <path class="wire" id="w0" pathLength="1" stroke="var(--emerald)" d="M300 192 C 540 150, 600 96, 712 96"/>
      <path class="wire" id="w1" pathLength="1" stroke="var(--amber)"   d="M300 192 C 540 150, 600 96, 1145 96"/>
      <path class="wire" id="w2" pathLength="1" stroke="var(--violet)"  d="M300 192 C 540 234, 600 288, 712 288"/>
      <path class="wire" id="w3" pathLength="1" stroke="var(--sky)"     d="M300 192 C 540 234, 600 288, 1145 288"/>
      <circle class="hub" id="hub" cx="300" cy="192" r="7"/>
    </svg>

    <!-- SOURCE : 1 création -->
    <div class="src">
      <div class="poster" id="poster">
        <span class="pimg"><svg class="drill" viewBox="0 0 240 160"><use href="#ic-drill" width="240" height="160"/></svg></span>
        <span class="ptitle">Perceuse 18V<br>Brushless</span>
        <span class="pprice" data-layout-allow-overlap>19€90</span>
      </div>
      <span class="src-tag" id="srctag">1 création</span>
    </div>

    <div class="one2n" id="one2n">
      <span class="big">1 <b>&rarr;</b> N</span>
      <small>Multi-format</small>
    </div>

    <!-- DESTINATIONS : N formats -->
    <div class="grid">
      <div class="card" data-c="0">
        <span class="ic" style="color:var(--emerald)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M9 13h6M9 17h6"/></svg></span>
        <span class="meta"><b>Impression</b><span>PDF/X · 300 DPI</span></span>
        <span class="done" data-layout-allow-overflow><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
      </div>
      <div class="card" data-c="1">
        <span class="ic" style="color:var(--amber)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
        <span class="meta"><b>PowerPoint</b><span>PPTX</span></span>
        <span class="done" data-layout-allow-overflow><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
      </div>
      <div class="card" data-c="2">
        <span class="ic" style="color:var(--violet)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 19 5-5 4 4 3-3 4 4"/></svg></span>
        <span class="meta"><b>Réseaux sociaux</b><span>PNG</span></span>
        <span class="done" data-layout-allow-overflow><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
      </div>
      <div class="card" data-c="3">
        <span class="ic" style="color:var(--sky)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg></span>
        <span class="meta"><b>Web</b><span>responsive</span></span>
        <span class="done" data-layout-allow-overflow><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Apparition du poster source (glissé/échelle sans fondu → blanc toujours opaque pour le contraste)
    tl.from("#poster", { x: -26, scale: 0.96, duration: 0.6, ease: "power3.out", transformOrigin: "50% 50%" }, 0.1);
    tl.from("#srctag", { y: 8, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.55);

    // Le hub « 1 → N » apparaît
    tl.to("#hub", { opacity: 1, duration: 0.3 }, 0.7);
    tl.fromTo("#one2n", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.8);

    // Init cartes (cachées) + ✓ réduits
    tl.set(".card", { opacity: 0, x: 28, scale: 0.92, transformOrigin: "0% 50%" }, 0);
    tl.set(".card .done", { scale: 0.3, transformOrigin: "50% 50%" }, 0);

    // Cascade : pour chaque format → tracer le connecteur, faire pop la carte, valider (✓)
    const order = [0, 1, 2, 3];
    order.forEach((c, i) => {
      const t = 1.15 + i * 0.78;
      // tracé du connecteur (stroke-dashoffset 1 → 0)
      tl.to(`#w${c}`, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut" }, t);
      // la carte pop à l'arrivée du trait
      tl.to(`.card[data-c='${c}']`, { opacity: 1, x: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, t + 0.32);
      // halo de l'icône
      tl.to(`.card[data-c='${c}'] .ic`, { borderColor: "currentColor", boxShadow: "0 0 24px -4px currentColor", duration: 0.35, ease: "power2.out" }, t + 0.45);
      // ✓ vert
      tl.to(`.card[data-c='${c}'] .done`, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.9)" }, t + 0.6);
    });

    // Maintien puis fondu doux pour une boucle propre
    tl.to("#s1", { opacity: 0, duration: 0.5, ease: "power2.in" }, 6.5);

    window.__timelines["feat-export"] = tl;
  </script>
</div>
</body>
</html>
