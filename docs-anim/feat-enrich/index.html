<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<style>
  :root{
    --bg:#0F0F0F; --surface:#141414; --elev:#1A1A1A; --surface2:#16161c;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --ink:#F2F2F2; --mut:rgba(255,255,255,.46);
    --indigo:#6366F1; --violet:#A78BFA; --sky:#38BDF8; --emerald:#34D399; --amber:#FBBF24;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [data-composition-id="feat-enrich"]{width:1600px;height:384px;position:relative;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);overflow:hidden}
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:26px 38px}
  .glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 30% 30%,rgba(99,102,241,.16),transparent 62%);pointer-events:none}

  .fiche{position:relative;width:100%;height:100%;border:1px solid var(--line2);border-radius:22px;background:linear-gradient(180deg,#16161c,#121217);box-shadow:0 40px 90px -40px #000;display:grid;grid-template-columns:236px 1fr;overflow:hidden}
  /* faisceau IA qui balaie la fiche */
  .beam{position:absolute;top:0;bottom:0;width:230px;z-index:6;background:linear-gradient(90deg,transparent,rgba(124,108,255,.32),rgba(167,139,250,.12),transparent);pointer-events:none;opacity:0;mix-blend-mode:screen}

  /* image produit */
  .pimg{position:relative;margin:22px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse 78% 64% at 50% 40%,#fff,#eef2f7 66%,#dde5ee)}
  .pimg .drill{position:absolute;inset:0;width:100%;height:100%;display:block}
  .pimg .ph{position:absolute;inset:0;display:grid;place-items:center;background:var(--elev);color:var(--mut)}
  .pimg .ph svg{width:46px;height:46px;opacity:.5}

  /* corps : champs */
  .body{padding:20px 30px 20px 8px;display:flex;flex-direction:column;gap:0}
  .htitle{display:flex;align-items:center;gap:18px;margin-bottom:6px}
  .htitle .t{position:relative;display:inline-block;width:560px;height:38px;font-size:29px;font-weight:800;letter-spacing:-.01em}
  .htitle .t .dash, .htitle .t .real{position:absolute;left:0;top:0;white-space:nowrap}
  .htitle .t .dash{color:var(--mut);font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:#cdc7ff;background:rgba(124,108,255,.16);border:1px solid rgba(124,108,255,.5);border-radius:100px;padding:7px 15px;opacity:0;box-shadow:0 0 26px -8px var(--violet)}
  .badge svg{width:16px;height:16px}
  .rows{display:flex;flex-direction:column;margin-top:6px}
  .row{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;padding:9px 12px;border-radius:10px}
  .row .k{font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.04em;color:var(--mut);text-transform:uppercase}
  .row .v{position:relative;font-size:21px;height:26px}
  .row .v .dash{position:absolute;inset:0;color:var(--mut);letter-spacing:.18em}
  .row .v .real{position:absolute;inset:0;opacity:0;color:var(--ink);font-variant-numeric:tabular-nums}
  .row.lit{background:rgba(99,102,241,.10)}
  .tags{display:flex;gap:10px;margin-top:12px;padding-left:12px}
  .tag{font-size:15px;color:#bbf7d0;background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.45);border-radius:100px;padding:6px 14px;opacity:0}
</style>
</head>
<body>
<div data-composition-id="feat-enrich" data-start="0" data-duration="7" data-width="1600" data-height="384">

  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <linearGradient id="dBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc6fb"/><stop offset=".55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
      <linearGradient id="dGrip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
      <linearGradient id="dMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    </defs>
    <symbol id="ic-drill" viewBox="0 0 240 160">
      <path d="M84 90 L122 90 L114 150 L78 150 Z" fill="url(#dGrip)"/>
      <rect x="66" y="141" width="60" height="19" rx="6" fill="url(#dMetal)"/>
      <path d="M122 95 q13 3 10 18 l-10 -3 Z" fill="#0f172a"/>
      <rect x="58" y="40" width="104" height="56" rx="16" fill="url(#dBody)"/>
      <rect x="72" y="49" width="48" height="6" rx="3" fill="rgba(255,255,255,.42)"/>
      <circle cx="140" cy="68" r="8" fill="rgba(255,255,255,.32)"/>
      <circle cx="92" cy="66" r="5" fill="#fbbf24"/>
      <rect x="154" y="52" width="16" height="28" rx="4" fill="url(#dMetal)"/>
      <path d="M168 54 L196 60 L196 72 L168 78 Z" fill="url(#dMetal)"/>
      <rect x="192" y="60" width="9" height="12" rx="2" fill="#e2e8f0"/>
      <rect x="200" y="63" width="34" height="5" rx="2.5" fill="#cbd5e1"/>
    </symbol>
  </svg>

  <div class="scene" id="s1">
    <div class="glow"></div>
    <div class="fiche">
      <div class="beam" id="beam" data-layout-allow-overflow></div>

      <div class="pimg">
        <div class="ph" id="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.6-3.6a2 2 0 0 0-2.8 0L6 21"/></svg></div>
        <svg class="drill" id="drill" viewBox="0 0 240 160"><use href="#ic-drill" width="240" height="160"/></svg>
      </div>

      <div class="body">
        <div class="htitle">
          <span class="t" data-layout-allow-overlap><span class="dash" id="tdash">Produit ·············</span><span class="real" id="treal" style="opacity:0">Perceuse-visseuse 18V Brushless</span></span>
          <span class="badge" id="badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.5L21 11l-6.6 2.5L12 20l-2.4-6.5L3 11l6.6-2.5z"/></svg>Enrichi par IA</span>
        </div>
        <div class="rows">
          <div class="row" data-i="0"><span class="k">Référence</span><span class="v"><span class="dash">— — — —</span><span class="real">DCD796P2-QW</span></span></div>
          <div class="row" data-i="1"><span class="k">EAN</span><span class="v"><span class="dash">— — — — — —</span><span class="real">5035048672341</span></span></div>
          <div class="row" data-i="2"><span class="k">Marque</span><span class="v"><span class="dash">— — —</span><span class="real">TechMaster</span></span></div>
          <div class="row" data-i="3"><span class="k">Couple / Régime</span><span class="v"><span class="dash">— — — —</span><span class="real">70 Nm · 2000 tr/min</span></span></div>
        </div>
        <div class="tags">
          <span class="tag">Outillage</span><span class="tag">Sans fil</span><span class="tag">Brushless</span><span class="tag">18V</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Apparition de la fiche
    tl.from("#s1 .fiche", { y: 26, opacity: 0, scale: 0.985, duration: 0.55, ease: "power3.out", transformOrigin: "50% 50%" }, 0.1);
    tl.set("#s1 .htitle .real", { opacity: 0 }, 0);

    // Le faisceau IA balaie la fiche de gauche à droite
    tl.set("#beam", { left: "-240px", opacity: 0 }, 0);
    tl.to("#beam", { opacity: 1, duration: 0.3 }, 0.8);
    tl.to("#beam", { left: "1600px", duration: 2.4, ease: "power1.inOut" }, 0.8);
    tl.to("#beam", { opacity: 0, duration: 0.3 }, 3.0);

    // L'image se révèle au passage du faisceau (gauche)
    tl.to("#ph", { opacity: 0, duration: 0.4 }, 1.1);
    tl.from("#drill", { opacity: 0, scale: 0.8, duration: 0.6, ease: "back.out(1.5)", transformOrigin: "52% 46%" }, 1.15);

    // Le titre se résout
    tl.to("#tdash", { opacity: 0, duration: 0.35 }, 1.35);
    tl.to("#treal", { opacity: 1, duration: 0.45, ease: "power2.out" }, 1.4);

    // Chaque ligne se remplit au passage du faisceau (stagger)
    const rows = ["[data-i='0']", "[data-i='1']", "[data-i='2']", "[data-i='3']"];
    rows.forEach((sel, i) => {
      const t = 1.5 + i * 0.42;
      tl.to(`#s1 .row${sel}`, { backgroundColor: "rgba(99,102,241,0.12)", duration: 0.3 }, t);
      tl.to(`#s1 .row${sel} .dash`, { opacity: 0, duration: 0.3 }, t + 0.05);
      tl.fromTo(`#s1 .row${sel} .real`, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t + 0.1);
      tl.to(`#s1 .row${sel}`, { backgroundColor: "rgba(99,102,241,0)", duration: 0.6 }, t + 0.6);
    });

    // Badge « Enrichi par IA » + tags
    tl.fromTo("#badge", { opacity: 0, scale: 0.7, x: -8 }, { opacity: 1, scale: 1, x: 0, duration: 0.5, ease: "back.out(1.7)" }, 3.4);
    tl.fromTo("#s1 .tag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.09 }, 3.5);

    // Maintien puis fondu doux pour une boucle propre
    tl.to("#s1", { opacity: 0, duration: 0.5, ease: "power2.in" }, 6.5);

    window.__timelines["feat-enrich"] = tl;
  </script>
</div>
</body>
</html>
