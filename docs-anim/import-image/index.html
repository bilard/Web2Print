<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<style>
  :root{
    --bg:#0F0F0F; --surface:#141414; --elev:#1A1A1A;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --ink:#F2F2F2; --mut:rgba(255,255,255,.46);
    --indigo:#6366F1; --violet:#A78BFA; --amber:#FBBF24; --sky:#38BDF8;
    --pink:#F472B6; --emerald:#34D399; --teal:#2DD4BF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [data-composition-id="import-image-demo"]{width:1920px;height:1080px;position:relative;background:var(--bg);font-family:Inter, sans-serif;color:var(--ink);overflow:hidden}
  .scene{position:absolute;inset:0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .scene .glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 8%,rgba(99,102,241,.16),transparent 60%);pointer-events:none}

  .win{width:1500px;border:1px solid var(--line2);border-radius:20px;background:var(--surface);overflow:hidden;box-shadow:0 60px 130px -50px rgba(0,0,0,.9)}
  .winbar{height:58px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#101010;border-bottom:1px solid var(--line)}
  .dots{display:flex;gap:9px}.dots i{width:14px;height:14px;border-radius:50%}
  .wt{font-family:"JetBrains Mono",monospace;font-size:19px;color:var(--mut)}
  .wbody{padding:30px;min-height:600px}

  /* Canvas éditeur (grille) */
  .ecanvas{position:relative;min-height:600px;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(99,102,241,.07),transparent 60%),#0c0c0c;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:30px 30px}
  .page{width:372px;aspect-ratio:50/68;background:#fff;border-radius:14px;position:relative;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}

  /* Image placée + sélection */
  .placed{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:236px;height:170px;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse 80% 66% at 50% 38%,#fff,#eef2f7 66%,#dde5ee);box-shadow:0 16px 36px -16px rgba(0,0,0,.5)}
  .placed .drill{position:absolute;inset:0;width:100%;height:100%;display:block}
  .selbox{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:252px;height:186px;border:2px solid var(--indigo);border-radius:6px;opacity:0;box-shadow:0 0 26px -6px rgba(99,102,241,.7);pointer-events:none}
  .selbox .ph{position:absolute;width:14px;height:14px;border:2px solid var(--indigo);border-radius:3px;background:#fff;opacity:0}
  .selbox .ph1{top:-8px;left:-8px}.selbox .ph2{top:-8px;right:-8px}.selbox .ph3{bottom:-8px;left:-8px}.selbox .ph4{bottom:-8px;right:-8px}
  .seltag{position:absolute;left:50%;top:48%;transform:translate(-50%,calc(-50% - 120px));font-size:14px;font-weight:700;color:#fff;background:var(--indigo);padding:5px 12px;border-radius:8px;white-space:nowrap;opacity:0}

  /* Vignette fichier (glissée) */
  .filecard{position:absolute;left:50%;top:48%;margin-left:-118px;margin-top:-85px;width:236px;border:1px solid var(--line2);border-radius:13px;background:var(--elev);overflow:hidden;box-shadow:0 26px 52px -18px rgba(0,0,0,.8);z-index:20}
  .filecard .fc-img{height:128px;position:relative;overflow:hidden;background:radial-gradient(ellipse 80% 66% at 50% 38%,#fff,#eef2f7 66%,#dde5ee)}
  .filecard .fc-img .drill{position:absolute;inset:0;width:100%;height:100%;display:block}
  .filecard .fc-meta{display:flex;align-items:center;gap:11px;padding:12px 14px}
  .filecard .fc-meta .ic{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;background:rgba(99,102,241,.18);color:var(--violet)}
  .filecard .fc-meta .ic svg{width:18px;height:18px}
  .filecard .fc-meta b{font-size:16px;display:block;line-height:1.2}
  .filecard .fc-meta span{font-size:13px;color:var(--mut);font-family:"JetBrains Mono",monospace}

  .cursor{position:absolute;left:50%;top:48%;width:30px;height:30px;z-index:30;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}

  /* Chip formats */
  .formats{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-size:16px;color:var(--mut);background:rgba(20,20,20,.82);border:1px solid var(--line2);border-radius:100px;padding:9px 20px;z-index:15}
  .formats svg{width:18px;height:18px;color:var(--sky)}
  .formats b{color:var(--ink);font-weight:600}
  .formats .fmt{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--mut)}
</style>
</head>
<body>
<div data-composition-id="import-image-demo" data-start="0" data-duration="9" data-width="1920" data-height="1080">

  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <linearGradient id="dBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc6fb"/><stop offset=".55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
      <linearGradient id="dGrip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
      <linearGradient id="dMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    </defs>
    <symbol id="ic-drill" viewBox="0 0 240 160">
      <path d="M84 90 L122 90 L114 150 L78 150 Z" fill="url(#dGrip)"/>
      <rect x="66" y="141" width="60" height="19" rx="6" fill="url(#dMetal)"/>
      <rect x="74" y="156" width="12" height="5" rx="2" fill="#64748b"/>
      <rect x="104" y="156" width="12" height="5" rx="2" fill="#64748b"/>
      <path d="M122 95 q13 3 10 18 l-10 -3 Z" fill="#0f172a"/>
      <rect x="58" y="40" width="104" height="56" rx="16" fill="url(#dBody)"/>
      <rect x="72" y="49" width="48" height="6" rx="3" fill="rgba(255,255,255,.42)"/>
      <circle cx="140" cy="68" r="8" fill="rgba(255,255,255,.32)"/>
      <circle cx="92" cy="66" r="5" fill="#fbbf24"/>
      <rect x="154" y="52" width="16" height="28" rx="4" fill="url(#dMetal)"/>
      <path d="M168 54 L196 60 L196 72 L168 78 Z" fill="url(#dMetal)"/>
      <rect x="192" y="60" width="9" height="12" rx="2" fill="#e2e8f0"/>
      <rect x="200" y="63" width="34" height="5" rx="2.5" fill="#cbd5e1"/>
      <path d="M206 64 l5 4 M214 64 l5 4 M222 64 l5 4" stroke="#94a3b8" stroke-width="1.4"/>
    </symbol>
    <symbol id="ic-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.6-3.6a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="ic-cursor" viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z" fill="#fff" stroke="#0f0f0f" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  </svg>

  <div id="s1" class="scene">
    <div class="glow"></div>
    <div class="win">
      <div class="winbar">
        <span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span>
        <span class="wt">Importer une image — nouveau projet</span>
      </div>
      <div class="wbody">
        <div class="ecanvas">
          <div class="page" id="page"></div>

          <!-- image finale posée -->
          <div class="placed" id="placed"><svg class="drill" viewBox="0 0 240 160"><use href="#ic-drill" width="240" height="160"/></svg></div>
          <div class="selbox" id="selbox"><span class="ph ph1"></span><span class="ph ph2"></span><span class="ph ph3"></span><span class="ph ph4"></span></div>
          <div class="seltag" id="seltag">visuel-produit.png · placé</div>

          <!-- vignette fichier glissée -->
          <div class="filecard" id="filecard" data-layout-allow-overflow>
            <div class="fc-img"><svg class="drill" viewBox="0 0 240 160"><use href="#ic-drill" width="240" height="160"/></svg></div>
            <div class="fc-meta"><span class="ic"><svg><use href="#ic-image"/></svg></span><span><b>visuel-produit.png</b><span>PNG · 1,2 Mo</span></span></div>
          </div>
          <svg class="cursor" id="cursor" data-layout-allow-overflow><use href="#ic-cursor"/></svg>

          <div class="formats" id="formats"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#ic-image"/></svg><b>Formats :</b><span class="fmt">PNG · JPG · WebP · GIF · SVG</span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* Entrée */
    tl.from("#s1", { opacity: 0, duration: 0.5 }, 0);
    tl.from("#page", { opacity: 0, scale: 0.96, duration: 0.55, ease: "power3.out", transformOrigin: "50% 50%" }, 0.5);
    tl.from("#formats", { opacity: 0, y: 16, duration: 0.45, ease: "power2.out" }, 0.85);

    /* La vignette + curseur arrivent du coin haut-droit (dans le canvas) */
    tl.set("#filecard", { opacity: 0, x: 300, y: -170, scale: 0.9 }, 0);
    tl.set("#cursor", { opacity: 0, x: 320, y: -120 }, 0);
    tl.to("#filecard", { opacity: 1, duration: 0.3 }, 1.2);
    tl.to("#cursor", { opacity: 1, duration: 0.3 }, 1.2);

    /* Glisse vers le centre de la page */
    tl.to("#filecard", { x: 0, y: 0, scale: 1, duration: 1.05, ease: "power2.inOut" }, 1.55);
    tl.to("#cursor", { x: 24, y: 18, duration: 1.05, ease: "power2.inOut" }, 1.55);

    /* Dépose : petit rebond, la vignette fond dans l'image placée */
    tl.to("#filecard", { scale: 1.04, duration: 0.18, ease: "power2.out" }, 2.6);
    tl.to("#filecard", { scale: 1, duration: 0.28, ease: "back.out(2)" }, 2.78);
    tl.set("#placed", { opacity: 0 }, 0);
    tl.to("#placed", { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.95);
    tl.to("#filecard", { opacity: 0, duration: 0.3, ease: "power1.out" }, 2.95);
    tl.to("#cursor", { opacity: 0, duration: 0.3 }, 3.0);

    /* Sélection : cadre + poignées + tag */
    tl.to("#selbox", { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.25);
    tl.to("#selbox .ph", { opacity: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.05 }, 3.35);
    tl.to("#seltag", { opacity: 1, duration: 0.35, ease: "power2.out" }, 3.5);
    tl.fromTo("#selbox", { boxShadow: "0 0 26px -6px rgba(99,102,241,.7)" }, { boxShadow: "0 0 40px 0px rgba(99,102,241,.95)", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.7);

    /* Le chip formats clignote une fois */
    tl.fromTo("#formats", { boxShadow: "0 0 0 0 rgba(56,189,248,0)" }, { boxShadow: "0 0 22px -6px rgba(56,189,248,.6)", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.6);

    /* Sortie douce pour une boucle propre */
    tl.to("#s1", { opacity: 0, duration: 0.45, ease: "power2.in" }, 8.4);

    window.__timelines["import-image-demo"] = tl;
  </script>
</div>
</body>
</html>
