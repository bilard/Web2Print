<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<style>
  :root{
    --bg:#0F0F0F; --surface:#141414; --elev:#1A1A1A; --surface2:#16161c;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --ink:#F2F2F2; --mut:rgba(255,255,255,.46);
    --indigo:#6366F1; --violet:#A78BFA; --sky:#38BDF8; --emerald:#34D399; --amber:#FBBF24;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [data-composition-id="feat-taxonomy"]{width:1600px;height:384px;position:relative;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);overflow:hidden}
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:26px 38px}
  .glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 28% 30%,rgba(99,102,241,.16),transparent 62%);pointer-events:none}

  .panel{position:relative;width:100%;height:100%;border:1px solid var(--line2);border-radius:22px;background:linear-gradient(180deg,#16161c,#121217);box-shadow:0 40px 90px -40px #000;overflow:hidden;
    display:grid;grid-template-columns:1.18fr .82fr;gap:30px;padding:24px 30px;align-items:stretch}

  /* === ARBRE (gauche) — repris de la TAXONOMIE dam === */
  .tx-tree{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--elev);padding:12px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px}
  .tx-node{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;font-size:20px;opacity:0}
  .tx-node .chev{width:14px;color:var(--mut);flex:0 0 14px;font-size:14px}
  .tx-node .fi{display:grid;place-items:center;flex:0 0 auto;color:var(--mut)}.tx-node .fi svg{width:21px;height:21px;display:block}
  .tx-node .lbl{font-weight:600}
  .tx-node .ct{margin-left:auto;font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:2px 12px;min-width:42px;text-align:center}
  .tx-node.l2{padding-left:36px;font-size:19px}
  .tx-node.l3{padding-left:60px;font-size:18px}
  .tx-node.sel{background:rgba(99,102,241,.16);box-shadow:inset 3px 0 0 var(--indigo)}
  .tx-node.sel .fi{color:var(--violet)}

  /* === ZONE DE RANGEMENT (droite) === */
  .tx-side{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px}
  .tx-drop{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;opacity:0}
  .tx-prod{position:absolute;top:54px;left:50%;width:236px;border:1px solid var(--line2);border-radius:14px;background:var(--surface2);padding:13px;display:flex;align-items:center;gap:14px;box-shadow:0 18px 40px -18px #000;opacity:0}
  .tx-prod .tp-img{width:58px;height:58px;border-radius:11px;overflow:hidden;flex:0 0 auto;position:relative;background:radial-gradient(ellipse 78% 64% at 50% 40%,#fff,#eef2f7 66%,#dde5ee)}
  .tx-prod .tp-img .drill{position:absolute;inset:0;width:100%;height:100%;display:block}
  .tx-prod .tp-txt b{font-size:17px;display:block;line-height:1.2}
  .tx-prod .tp-txt span{font-size:13px;color:var(--mut)}
  .tx-prod .tp-scan{position:absolute;left:0;right:0;top:0;height:18px;background:linear-gradient(180deg,rgba(124,108,255,.55),transparent);opacity:0;pointer-events:none}
  /* flèche de rangement automatique */
  .tx-arrow{position:absolute;left:50%;color:var(--emerald);opacity:0;transform:translateX(-50%)}
  .tx-arrow svg{width:34px;height:34px;display:block;filter:drop-shadow(0 0 10px rgba(52,211,153,.55))}
  /* étiquette « classé automatiquement » */
  .tx-auto{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;
    font-size:15px;font-weight:700;color:#bbf7d0;background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.45);border-radius:100px;padding:7px 16px;opacity:0;white-space:nowrap}
  .tx-auto svg{width:16px;height:16px}
</style>
</head>
<body>
<div data-composition-id="feat-taxonomy" data-start="0" data-duration="7" data-width="1600" data-height="384">

  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <linearGradient id="dBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc6fb"/><stop offset=".55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
      <linearGradient id="dGrip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
      <linearGradient id="dMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    </defs>
    <symbol id="ic-drill" viewBox="0 0 240 160">
      <path d="M84 90 L122 90 L114 150 L78 150 Z" fill="url(#dGrip)"/>
      <rect x="66" y="141" width="60" height="19" rx="6" fill="url(#dMetal)"/>
      <path d="M122 95 q13 3 10 18 l-10 -3 Z" fill="#0f172a"/>
      <rect x="58" y="40" width="104" height="56" rx="16" fill="url(#dBody)"/>
      <rect x="72" y="49" width="48" height="6" rx="3" fill="rgba(255,255,255,.42)"/>
      <circle cx="140" cy="68" r="8" fill="rgba(255,255,255,.32)"/>
      <circle cx="92" cy="66" r="5" fill="#fbbf24"/>
      <rect x="154" y="52" width="16" height="28" rx="4" fill="url(#dMetal)"/>
      <path d="M168 54 L196 60 L196 72 L168 78 Z" fill="url(#dMetal)"/>
      <rect x="192" y="60" width="9" height="12" rx="2" fill="#e2e8f0"/>
      <rect x="200" y="63" width="34" height="5" rx="2.5" fill="#cbd5e1"/>
    </symbol>
    <!-- pictos arbre -->
    <symbol id="ic-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="ic-layers" viewBox="0 0 24 24"><path d="m12 2 9 4-9 4-9-4z"/><path d="m21 12-9 4-9-4"/></symbol>
    <symbol id="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="ic-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></symbol>
  </svg>

  <div class="scene" id="s1">
    <div class="glow"></div>
    <div class="panel">

      <!-- Arbre catégories -->
      <div class="tx-tree" id="tree">
        <div class="tx-node" id="n0"><span class="chev">›</span><span class="fi"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#ic-folder"/></svg></span><span class="lbl">Outillage</span><span class="ct" id="c0">128</span></div>
        <div class="tx-node l2" id="n1"><span class="chev">›</span><span class="fi"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#ic-folder"/></svg></span><span class="lbl">Perçage</span><span class="ct" id="c1">41</span></div>
        <div class="tx-node l3" id="n2"><span class="fi"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#ic-layers"/></svg></span><span class="lbl">Perceuses sans fil</span><span class="ct" id="c2">17</span></div>
        <div class="tx-node l3" id="n3"><span class="fi"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#ic-layers"/></svg></span><span class="lbl">Perforateurs</span><span class="ct" id="c3">9</span></div>
        <div class="tx-node l2" id="n4"><span class="chev">›</span><span class="fi"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#ic-folder"/></svg></span><span class="lbl">Vissage</span><span class="ct" id="c4">22</span></div>
      </div>

      <!-- Produit qui se range tout seul -->
      <div class="tx-side">
        <span class="tx-drop" id="drop">Produit scrappé</span>

        <div class="tx-prod" id="prod" data-layout-allow-overlap>
          <span class="tp-img"><svg class="drill" viewBox="0 0 240 160"><use href="#ic-drill" width="240" height="160"/></svg><span class="tp-scan" id="scan"></span></span>
          <span class="tp-txt"><b>Perceuse-visseuse 18V</b><span>Brushless · sans fil</span></span>
        </div>

        <span class="tx-arrow" id="arrow" data-layout-allow-overflow><svg viewBox="0 0 24 24"><use href="#ic-arrow"/></svg></span>

        <span class="tx-auto" id="auto"><svg viewBox="0 0 24 24"><use href="#ic-check"/></svg>Classé automatiquement</span>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Apparition du panneau
    tl.from("#s1 .panel", { y: 24, opacity: 0, scale: 0.986, duration: 0.55, ease: "power3.out", transformOrigin: "50% 50%" }, 0.1);

    // L'arbre se construit branche par branche
    const nodes = ["#n0", "#n1", "#n2", "#n3", "#n4"];
    nodes.forEach((sel, i) => {
      tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.55 + i * 0.26);
    });

    // La carte produit apparaît en haut à droite et se fait scanner
    tl.set("#prod", { x: "-50%", y: 0, scale: 1 }, 0);
    tl.fromTo("#drop", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.7);
    tl.fromTo("#prod", { opacity: 0, y: -16, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 1.9);

    // Scan IA de la carte (lecture de la catégorie)
    tl.set("#scan", { top: 0 }, 0);
    tl.to("#scan", { opacity: 1, duration: 0.2 }, 2.5);
    tl.to("#scan", { top: "calc(100% - 18px)", duration: 0.7, ease: "power1.inOut" }, 2.5);
    tl.to("#scan", { opacity: 0, duration: 0.2 }, 3.2);

    // La carte descend automatiquement vers la bonne branche (« Perceuses sans fil »)
    tl.to("#prod", { y: 168, scale: 0.62, duration: 0.95, ease: "power2.inOut" }, 3.45);
    tl.to("#prod", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.35);

    // La flèche de rangement descend en parallèle
    tl.set("#arrow", { top: 96 }, 0);
    tl.fromTo("#arrow", { opacity: 0, top: 96 }, { opacity: 1, top: 132, duration: 0.5, ease: "power2.out" }, 3.5);
    tl.to("#arrow", { top: 188, opacity: 0, duration: 0.5, ease: "power2.in" }, 4.2);

    // La bonne branche se surligne
    tl.call(() => { document.getElementById("n2").classList.add("sel"); }, null, 4.45);
    tl.fromTo("#n2", { backgroundColor: "rgba(99,102,241,0)", boxShadow: "inset 0px 0 0 var(--indigo)" }, { backgroundColor: "rgba(99,102,241,0.16)", boxShadow: "inset 3px 0 0 var(--indigo)", duration: 0.4, ease: "power2.out" }, 4.45);

    // Les compteurs s'incrémentent (17 → 18, 41 → 42, 128 → 129)
    tl.to("#c2", { color: "#34D399", duration: 0.25 }, 4.6);
    tl.call(() => { document.getElementById("c2").textContent = "18"; }, null, 4.65);
    tl.fromTo("#c2", { scale: 1.5 }, { scale: 1, duration: 0.45, ease: "back.out(2.4)", transformOrigin: "50% 50%" }, 4.65);
    tl.call(() => { document.getElementById("c1").textContent = "42"; }, null, 4.85);
    tl.fromTo("#c1", { scale: 1.4 }, { scale: 1, duration: 0.4, ease: "back.out(2.2)", transformOrigin: "50% 50%" }, 4.85);
    tl.call(() => { document.getElementById("c0").textContent = "129"; }, null, 5.0);
    tl.fromTo("#c0", { scale: 1.35 }, { scale: 1, duration: 0.4, ease: "back.out(2)", transformOrigin: "50% 50%" }, 5.0);

    // Étiquette « Classé automatiquement »
    tl.fromTo("#auto", { opacity: 0, scale: 0.8, y: 8 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" }, 5.2);

    // Maintien puis fondu doux pour une boucle propre
    tl.to("#s1", { opacity: 0, duration: 0.5, ease: "power2.in" }, 6.5);

    window.__timelines["feat-taxonomy"] = tl;
  </script>
</div>
</body>
</html>
