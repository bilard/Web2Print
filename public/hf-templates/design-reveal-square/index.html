<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1080px;
        background: #0a0a0a; overflow: hidden;
        font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      [data-composition-id="design-reveal-square"] {
        position: relative;
        width: 1080px; height: 1080px;
        background: #0a0a0a;
        overflow: hidden;
      }

      .stage {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
        perspective: 2200px;
      }
      .svg-host {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      .svg-host > svg {
        width: 100%; height: 100%;
        filter: drop-shadow(0 24px 50px rgba(0,0,0,0.5));
      }

      /* Cadre lumineux d'accent : TOUJOURS rendu (même sans caption) pour que
         la palette.accent choisie par l'IA soit visible. box-shadow figé,
         seule l'opacité est animée (seek-safe, compositor-friendly). */
      .accent-frame {
        position: absolute; inset: 0;
        pointer-events: none; z-index: 6; opacity: 0;
        box-shadow: inset 0 0 0 8px var(--accent), inset 0 0 90px -20px var(--accent);
      }
      /* Barre d'accent bas de cadre — wipe horizontal, reflète l'accent. */
      .accent-bar {
        position: absolute; left: 0; bottom: 0;
        height: 12px; width: 100%;
        background: var(--accent);
        transform-origin: 0% 50%; transform: scaleX(0);
        z-index: 7; opacity: 0.95;
      }

      .caption {
        position: absolute;
        left: 64px; right: 64px; bottom: 70px;
        color: #fff;
        font-size: 68px; font-weight: 900;
        letter-spacing: -0.03em; line-height: 0.98;
        text-shadow: 0 8px 22px rgba(0,0,0,0.9);
        z-index: 10;
      }
      .caption[hidden] { display: none; }
      .caption .word { display: inline-block; padding-right: 0.22em; will-change: transform, opacity; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="design-reveal-square"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1080"
      data-composition-variables='[
        {"id":"svg","type":"string","label":"SVG inline","default":""},
        {"id":"caption","type":"string","label":"Caption","default":""},
        {"id":"prompt","type":"string","label":"Prompt de formatage","default":""},
        {"id":"styleConfig","type":"object","label":"Style config (pace/intensity/ease/motion/palette)","default":null}
      ]'
    >
      <div class="stage" id="stage">
        <div class="svg-host" id="svg-host"></div>
      </div>

      <div class="accent-frame" id="accent-frame"></div>
      <div class="accent-bar" id="accent-bar"></div>
      <div class="caption" id="caption" hidden></div>
    </div>

    <script>
      (function () {
        const hf = window.__hyperframes;
        const vars = (hf && typeof hf.getVariables === 'function' ? hf.getVariables() : {}) || {};

        // ── Style config (Gemini-derived) ───────────────────────────────────
        const sc = vars.styleConfig || {};
        const palette = sc.palette || {};
        const BG = palette.bg || '#0a0a0a';
        const ACCENT = palette.accent || '#ffffff';
        const PACE_MULT = { slow: 1.3, normal: 1.0, fast: 0.7 }[sc.pace] ?? 1.0;
        const INT_SCALE = { subtle: 0.5, normal: 1.0, punchy: 1.8 }[sc.intensity] ?? 1.0;
        const EASE_IN   = { soft: 'power2.out', classic: 'expo.out',  snappy: 'back.out(1.4)' }[sc.ease] ?? 'expo.out';
        const EASE_OUT  = { soft: 'power2.inOut', classic: 'power2.in', snappy: 'back.in(1.2)' }[sc.ease] ?? 'power2.in';
        const DUR_SCALE = (typeof vars.durationScale === 'number' && vars.durationScale > 0) ? vars.durationScale : 1;
        const dur = (d) => d * PACE_MULT * DUR_SCALE;
        const amp = (v) => v * INT_SCALE;

        // ── PERSONNALITÉ DU MOUVEMENT ────────────────────────────────────────
        // C'est le levier qui rend audience/objectif/ton visiblement différents.
        // Chaque preset active/désactive des blocs de la chorégraphie. Tout reste
        // séquentiel (pas de yoyo) → déterministe au seek HyperFrames.
        const MOTION = {
          cinematic: { hue:false, oscillate:false, flip:true,  flipAmp:0.55, breathAmp:0.03,  entryEase:'power2.out',     entrySlide:0.6, frame:'soft',   bar:false, wiggle:false },
          energetic: { hue:true,  oscillate:true,  flip:true,  flipAmp:1.0,  breathAmp:0.08,  entryEase:'power3.out',     entrySlide:1.0, frame:'strong', bar:true,  wiggle:false },
          minimal:   { hue:false, oscillate:false, flip:false, flipAmp:0,    breathAmp:0.012, entryEase:'power2.out',     entrySlide:0.2, frame:'thin',   bar:false, wiggle:false },
          playful:   { hue:true,  oscillate:true,  flip:false, flipAmp:0,    breathAmp:0.09,  entryEase:'back.out(1.6)',  entrySlide:1.1, frame:'strong', bar:true,  wiggle:true  },
        };
        const M = MOTION[sc.motion] || MOTION.cinematic;
        const PLAN = (vars.motionPlan && typeof vars.motionPlan === 'object') ? vars.motionPlan : null;
        const FROM_SCRATCH = !!(PLAN && PLAN.fromScratch);
        console.log('[design-reveal-square] motion=', sc.motion, '· pace=', sc.pace, '· DUR_SCALE=', DUR_SCALE);

        document.body.style.background = BG;
        const compEl = document.querySelector('[data-composition-id="design-reveal-square"]');
        if (compEl) compEl.style.background = '#ffffff';
        document.documentElement.style.setProperty('--accent', ACCENT);

        const host = document.getElementById('svg-host');
        if (vars.svg) host.innerHTML = String(vars.svg);

        // Cadre d'accent : intensité du box-shadow selon la personnalité.
        const frameEl = document.getElementById('accent-frame');
        const FRAME_SHADOW = {
          thin:   'inset 0 0 0 5px var(--accent)',
          soft:   'inset 0 0 0 8px var(--accent), inset 0 0 90px -20px var(--accent)',
          strong: 'inset 0 0 0 12px var(--accent), inset 0 0 140px -10px var(--accent)',
        };
        if (frameEl) frameEl.style.boxShadow = FRAME_SHADOW[M.frame] || FRAME_SHADOW.soft;
        const FRAME_OPACITY = M.frame === 'thin' ? 0.5 : M.frame === 'strong' ? 0.95 : 0.7;

        const capEl = document.getElementById('caption');
        if (vars.caption) {
          const words = String(vars.caption).split(/\s+/).filter(Boolean);
          capEl.innerHTML = words.map(w => '<span class="word">' + w + '</span>').join('');
          capEl.style.color = ACCENT;
          capEl.hidden = false;
        }

        const svgEl = host.querySelector('svg');
        const shapes = svgEl ? Array.from(svgEl.querySelectorAll('path, rect, circle, polygon, polyline, ellipse, line')) : [];
        const images = svgEl ? Array.from(svgEl.querySelectorAll('image')) : [];
        const texts  = svgEl ? Array.from(svgEl.querySelectorAll('text'))  : [];

        // Détecte un SVG "raster-only" : aucune forme, aucun texte, juste 1 ou 2 images
        // (cas typique d'une page importée depuis un PDF/DAM en bitmap unique).
        const RASTER_ONLY = shapes.length === 0 && texts.length === 0 && images.length >= 1 && images.length <= 2;

        const tl = gsap.timeline({ paused: true });

        // ===== ENTRÉE DU STAGE : amplitude pilotée par la personnalité =====
        const slideAmp = amp(100) * M.entrySlide;
        tl.from('#stage', { x: -slideAmp, opacity: 0, duration: dur(0.9), ease: M.entryEase }, 0);

        // ===== ACCENT : cadre lumineux + barre (toujours, reflète palette.accent) =====
        tl.fromTo(frameEl, { opacity: 0 }, { opacity: FRAME_OPACITY, duration: dur(0.8), ease: 'power2.out' }, dur(0.3));
        if (M.bar) {
          // Barre qui balaye puis 2 pulses d'opacité (signage/promo).
          tl.fromTo('#accent-bar', { scaleX: 0, opacity: 0.95 }, { scaleX: 1, duration: dur(1.1), ease: M.entryEase }, dur(0.4));
          tl.to('#accent-bar', { opacity: 0.5, duration: dur(0.6), ease: 'sine.inOut' }, dur(4.5));
          tl.to('#accent-bar', { opacity: 0.95, duration: dur(0.6), ease: 'sine.inOut' }, dur(5.3));
          tl.to('#accent-bar', { opacity: 0.5, duration: dur(0.6), ease: 'sine.inOut' }, dur(6.5));
          tl.to('#accent-bar', { opacity: 0.95, duration: dur(0.6), ease: 'sine.inOut' }, dur(7.3));
        } else {
          // Sobre : la barre se révèle lentement et reste stable.
          tl.fromTo('#accent-bar', { scaleX: 0, opacity: 0.8 }, { scaleX: 1, duration: dur(1.6), ease: 'power2.out' }, dur(0.5));
        }

        if (!FROM_SCRATCH) {
        // ===== OSCILLATION HORIZONTALE (energetic / playful) =====
        if (M.oscillate) {
          const oa = slideAmp;
          tl.to('#stage', { x: oa * 0.4, duration: dur(2.2), ease: 'sine.inOut' }, dur(1.5));
          tl.to('#stage', { x: -oa * 0.4, duration: dur(2.2), ease: 'sine.inOut' }, dur(3.7));
          tl.to('#stage', { x: oa * 0.3, duration: dur(2.0), ease: 'sine.inOut' }, dur(5.9));
          tl.to('#stage', { x: 0, duration: dur(1.5), ease: 'sine.inOut' }, dur(7.9));
        }

        // ===== HUE-ROTATE (energetic / playful uniquement — couleurs vives) =====
        // cinematic & minimal gardent les couleurs FIDÈLES à la marque.
        if (M.hue) {
          tl.to('#stage', { filter: 'hue-rotate(60deg)',  duration: dur(2.0), ease: 'sine.inOut' }, dur(1.0));
          tl.to('#stage', { filter: 'hue-rotate(-30deg)', duration: dur(2.0), ease: 'sine.inOut' }, dur(3.5));
          tl.to('#stage', { filter: 'hue-rotate(45deg)',  duration: dur(2.0), ease: 'sine.inOut' }, dur(5.8));
          tl.to('#stage', { filter: 'hue-rotate(0deg)',   duration: dur(1.5), ease: 'sine.inOut' }, dur(8.0));
        }

        // ===== RESPIRATION / PULSE SCALE — amplitude pilotée par la personnalité =====
        const b = M.breathAmp;
        if (M.oscillate) {
          // Pulse marqué en 4 temps (energetic / playful).
          tl.to('#stage', { scale: 1 + b, duration: dur(1.5), ease: 'sine.inOut' }, dur(1.5));
          tl.to('#stage', { scale: 1 - b * 0.4, duration: dur(1.5), ease: 'sine.inOut' }, dur(3.5));
          tl.to('#stage', { scale: 1 + b * 0.6, duration: dur(1.5), ease: 'sine.inOut' }, dur(5.5));
          tl.to('#stage', { scale: 1.0, duration: dur(1.5), ease: 'sine.inOut' }, dur(7.5));
        } else {
          // Respiration douce en 2 temps (cinematic / minimal).
          tl.to('#stage', { scale: 1 + b, duration: dur(3.5), ease: 'sine.inOut' }, dur(1.2));
          tl.to('#stage', { scale: 1.0, duration: dur(3.5), ease: 'sine.inOut' }, dur(5.2));
        }

        if (RASTER_ONLY) {
          tl.set(images, { opacity: 0, transformOrigin: '50% 50%' }, 0);
          tl.to(images, { opacity: 1, duration: dur(0.9), ease: EASE_IN }, dur(0.2));
          tl.fromTo(images, {
            x: -amp(60), y: amp(30), scale: 1.0,
          }, {
            x: amp(60), y: -amp(30), scale: 1 + amp(0.20),
            duration: dur(8.5), ease: 'sine.inOut',
          }, dur(0.6));
        } else {
          const allSvgEls = [...shapes, ...images, ...texts];
          if (allSvgEls.length > 0) tl.set(allSvgEls, { opacity: 0 }, 0);

          // Amplitude d'entrée des éléments pilotée par la personnalité :
          // minimal ≈ pur fade, energetic/playful = slide marqué alterné.
          const es = M.entrySlide;
          if (shapes.length > 0) {
            shapes.forEach((shape, i) => {
              const fromX = (i % 2 === 0 ? -amp(180) : amp(180)) * es;
              tl.fromTo(shape, { x: fromX, opacity: 0 }, {
                x: 0, opacity: 1, duration: dur(0.7), ease: M.entryEase,
              }, dur(0.4 + i * Math.min(0.03, 1.2 / shapes.length) * PACE_MULT));
            });
          }
          if (images.length > 0) {
            images.forEach((img, i) => {
              const fromX = (i % 2 === 0 ? amp(140) : -amp(140)) * es;
              tl.fromTo(img, { x: fromX, opacity: 0 }, {
                x: 0, opacity: 1, duration: dur(0.8), ease: M.entryEase,
              }, dur(1.4 + i * Math.min(0.10, 1.5 / images.length) * PACE_MULT));
            });
          }
          if (texts.length > 0) {
            texts.forEach((txt, i) => {
              const fromX = (i % 2 === 0 ? -amp(120) : amp(120)) * es;
              tl.fromTo(txt, { x: fromX, opacity: 0 }, {
                x: 0, opacity: 1, duration: dur(0.7), ease: M.entryEase,
              }, dur(2.6 + i * Math.min(0.08, 1.5 / texts.length) * PACE_MULT));
            });
          }
        }
        } // end if (!FROM_SCRATCH) — blocs oscillation/hue/respiration/leaves

        // ===== CAPTION : mots arrivent alternés + color cycle (si hue) =====
        const wordEls = capEl.querySelectorAll('.word');
        if (wordEls.length > 0) {
          tl.set(wordEls, { opacity: 0 }, 0);
          Array.from(wordEls).forEach((w, i) => {
            const fromX = (i % 2 === 0 ? -amp(140) : amp(140)) * M.entrySlide;
            tl.fromTo(w, { x: fromX, opacity: 0 }, {
              x: 0, opacity: 1, duration: dur(0.65), ease: M.entryEase,
            }, dur(4.0 + i * 0.12 * PACE_MULT));
          });
          if (M.hue) {
            // Color cycle séquentiel (pas yoyo — seek-safe)
            tl.to(wordEls, { color: ACCENT,    duration: dur(0.8), ease: 'sine.inOut', stagger: 0.08 * PACE_MULT }, dur(5.2));
            tl.to(wordEls, { color: '#ffffff', duration: dur(0.8), ease: 'sine.inOut', stagger: 0.08 * PACE_MULT }, dur(6.3));
            tl.to(wordEls, { color: ACCENT,    duration: dur(0.8), ease: 'sine.inOut', stagger: 0.08 * PACE_MULT }, dur(7.4));
            tl.to(wordEls, { color: '#ffffff', duration: dur(0.8), ease: 'sine.inOut', stagger: 0.08 * PACE_MULT }, dur(8.5));
          }
          tl.to(wordEls, { y: -amp(7), opacity: 0.9, duration: dur(0.6), ease: EASE_OUT }, dur(9.3));
        }

        if (!FROM_SCRATCH) {
        // ── 3D FLIP rotateY sur le svg-host (cinematic / energetic) ──
        if (M.flip) {
          const f = M.flipAmp;
          tl.to('#svg-host', { rotationY: -15 * f, duration: dur(0.9), ease: 'sine.inOut' }, dur(2.0));
          tl.to('#svg-host', { rotationY: 12 * f,  duration: dur(0.9), ease: 'sine.inOut' }, dur(3.0));
          tl.to('#svg-host', { rotationY: -6 * f,  duration: dur(0.6), ease: 'sine.inOut' }, dur(4.0));
          tl.to('#svg-host', { rotationY: 0,       duration: dur(0.6), ease: 'power2.out' }, dur(4.7));
        }

        // ── WIGGLE rotation Z (playful) — petit balancement ludique ──
        if (M.wiggle) {
          tl.to('#svg-host', { rotation: -3, duration: dur(0.7), ease: 'sine.inOut' }, dur(1.8));
          tl.to('#svg-host', { rotation: 3,  duration: dur(0.7), ease: 'sine.inOut' }, dur(2.5));
          tl.to('#svg-host', { rotation: -2, duration: dur(0.6), ease: 'sine.inOut' }, dur(3.2));
          tl.to('#svg-host', { rotation: 0,  duration: dur(0.6), ease: 'power2.out' }, dur(3.8));
        }
        } // end if (!FROM_SCRATCH) — blocs flip/wiggle

        // ===== ANIMATIONS PAR-OBJET (B-fidèle) =====
        // Rejoue le preset posé sur chaque objet via « Animer l'objet », sur son
        // <g id="w2panim-..."> tagué à la capture. ADDITIF (par-dessus la
        // chorégraphie globale). Seek-safe : repeat FINI + yoyo, jamais -1.
        // Les presets 3D (flip/relief/particules) sont exclus côté capture →
        // ils retombent sur la personnalité globale (B-robuste).
        const objAnims = Array.isArray(vars.objectAnimations) ? vars.objectAnimations : [];
        objAnims.forEach((oa) => {
          if (!oa || !oa.id) return;
          let node = null;
          try { node = svgEl && svgEl.querySelector('#' + (window.CSS && CSS.escape ? CSS.escape(oa.id) : oa.id)); } catch (e) { node = null; }
          if (!node) return;
          // Le <g> réel porte la matrix de positionnement Fabric. On l'enveloppe
          // dans un groupe IDENTITÉ et on anime le wrapper → évite le saut d'origine
          // (piège GSAP-sur-SVG quand l'élément a déjà un transform matriciel).
          try {
            const wrap = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            node.parentNode.insertBefore(wrap, node);
            wrap.appendChild(node);
            node = wrap;
          } catch (e) { /* repli : on anime le node tel quel */ }
          const cfg = oa.config || {};
          const D = Math.max(0.5, Math.min(8, +cfg.duration || 3)) * DUR_SCALE;
          const I = Math.max(0.3, Math.min(2.5, +cfg.intensity || 1));
          const dir = cfg.direction;
          const loop = cfg.loop !== false;
          const REP = loop ? Math.min(30, Math.max(1, Math.ceil((10 * DUR_SCALE) / (D || 1)))) : 0;
          const half = Math.max(0.15, D / 2);
          gsap.set(node, { transformOrigin: '50% 50%' });
          switch (cfg.preset) {
            case 'slideEntrance':
              tl.from(node, { x: (dir === 'right' ? -1 : 1) * 140 * I, opacity: 0, duration: dur(0.8), ease: 'power3.out' }, 0);
              break;
            case 'slideVertical':
              tl.from(node, { y: (dir === 'bottom' ? -1 : 1) * 140 * I, opacity: 0, duration: dur(0.8), ease: 'power3.out' }, 0);
              break;
            case 'pulseScale':
              tl.to(node, { scale: 1 + 0.12 * I, duration: half, ease: 'sine.inOut', repeat: REP, yoyo: true }, 0);
              break;
            case 'bounce':
              tl.to(node, { y: -36 * I, duration: half, ease: 'power1.out', repeat: REP, yoyo: true }, 0);
              break;
            case 'wave':
              tl.to(node, { skewX: 8 * I, duration: half, ease: 'sine.inOut', repeat: REP, yoyo: true }, 0);
              break;
            case 'vibrate':
              tl.fromTo(node, { x: -3 * I }, { x: 3 * I, duration: 0.06, ease: 'none', repeat: Math.min(140, REP * 8), yoyo: true }, 0);
              break;
            case 'motionPath':
              tl.to(node, { x: 28 * I, y: -20 * I, duration: half, ease: 'sine.inOut', repeat: REP, yoyo: true }, 0);
              break;
            case 'rotate3D':
              tl.to(node, { rotation: 8 * I, skewX: 4 * I, duration: half, ease: 'sine.inOut', repeat: REP, yoyo: true }, 0);
              break;
            case 'hueCycle':
              gsap.set(node, { filter: 'hue-rotate(0deg)' });
              tl.to(node, { filter: 'hue-rotate(180deg)', duration: D, ease: 'sine.inOut', repeat: REP, yoyo: true }, 0);
              break;
            case 'glowAccent':
              gsap.set(node, { filter: 'drop-shadow(0 0 0px ' + ACCENT + ')' });
              tl.to(node, { filter: 'drop-shadow(0 0 ' + (18 * I) + 'px ' + ACCENT + ')', duration: half, ease: 'sine.inOut', repeat: REP, yoyo: true }, 0);
              break;
            default: break;
          }
        });

        // ===== PLAN DE MOTION DESIGNER (prompt IA) =====
        // Applique chaque directive par élément, par-dessus (ou à la place si fromScratch)
        // la chorégraphie globale. Seek-safe : repeat fini + yoyo ; wrapper identité anti-saut.
        function w2pWrap(node) {
          try {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            node.parentNode.insertBefore(g, node);
            g.appendChild(node);
            return g;
          } catch (e) { return node; }
        }
        function w2pTotalSec() {
          // durée approx de la timeline pour calculer les répétitions finies
          return 10 * DUR_SCALE;
        }
        function w2pApplyDirective(node, d) {
          const I = (typeof d.intensity === 'number') ? d.intensity : 0.6;
          const dir = d.direction;
          const start = (typeof d.startSec === 'number') ? d.startSec * DUR_SCALE : 0;
          const D = (typeof d.durationSec === 'number') ? d.durationSec * DUR_SCALE : null;
          const total = w2pTotalSec();
          const col = (typeof d.color === 'string') ? d.color : ACCENT;
          const offX = (dir === 'right') ? -1 : 1;     // entre depuis la gauche par défaut
          const offY = (dir === 'bottom') ? -1 : 1;
          const outX = (dir === 'right') ? 1 : (dir === 'left' ? -1 : 1);
          const outY = (dir === 'bottom') ? 1 : (dir === 'top' ? -1 : 1);
          gsap.set(node, { transformOrigin: '50% 50%' });
          const loopHalf = D ? D / 2 : Math.max(0.3, dur(0.9));
          const REP = Math.min(40, Math.max(1, Math.ceil(total / (D || (loopHalf * 2)))));
          switch (d.effect) {
            // ── entry ──
            case 'slide-in': {
              const vert = (dir === 'top' || dir === 'bottom');
              tl.from(node, vert
                ? { y: offY * 140 * (0.5 + I), opacity: 0, duration: D || dur(0.8), ease: 'power3.out' }
                : { x: offX * 140 * (0.5 + I), opacity: 0, duration: D || dur(0.8), ease: 'power3.out' }, start);
              break;
            }
            case 'fade-in':  tl.from(node, { opacity: 0, duration: D || dur(0.8), ease: 'power2.out' }, start); break;
            case 'scale-in': tl.from(node, { scale: 0.7, opacity: 0, duration: D || dur(0.7), ease: 'back.out(1.4)' }, start); break;
            case 'blur-in':  tl.from(node, { filter: 'blur(18px)', opacity: 0, duration: D || dur(0.8), ease: 'power2.out' }, start); break;
            case 'drop-in':  tl.from(node, { y: -160 * (0.5 + I), opacity: 0, duration: D || dur(0.8), ease: 'bounce.out' }, start); break;
            case 'fly-in':   tl.from(node, { x: offX * 200 * (0.5 + I), scale: 0.6, opacity: 0, duration: D || dur(0.8), ease: 'power3.out' }, start); break;
            case 'flip-in':  tl.from(node, { scaleX: 0, opacity: 0, duration: D || dur(0.8), ease: 'power2.out' }, start); break;
            case 'door-in':  gsap.set(node, { transformOrigin: (dir === 'right' ? '100% 50%' : '0% 50%') }); tl.from(node, { scaleX: 0, opacity: 0, duration: D || dur(0.8), ease: 'power2.out' }, start); break;
            case 'fold-in':  gsap.set(node, { transformOrigin: (dir === 'bottom' ? '50% 100%' : '50% 0%') }); tl.from(node, { scaleY: 0, opacity: 0, duration: D || dur(0.8), ease: 'power2.out' }, start); break;
            case 'depth-in': tl.from(node, { scale: 0.3 + 0.2 * (1 - I), opacity: 0, duration: D || dur(0.8), ease: 'power2.out' }, start); break;
            // ── loop ──
            case 'pulse':    tl.to(node, { scale: 1 + 0.12 * I, duration: loopHalf, ease: 'sine.inOut', repeat: REP, yoyo: true }, start); break;
            case 'bounce':   tl.to(node, { y: -36 * I, duration: loopHalf, ease: 'power1.out', repeat: REP, yoyo: true }, start); break;
            case 'wave':     tl.to(node, { skewX: 8 * I, duration: loopHalf, ease: 'sine.inOut', repeat: REP, yoyo: true }, start); break;
            case 'float':    tl.to(node, { y: -10 * I, duration: loopHalf * 1.6, ease: 'sine.inOut', repeat: REP, yoyo: true }, start); break;
            case 'wiggle':   tl.to(node, { rotation: 3 * I, duration: loopHalf, ease: 'sine.inOut', repeat: REP, yoyo: true }, start); break;
            case 'tilt3d':   tl.to(node, { scaleX: 1 - 0.18 * I, skewY: 6 * I, duration: loopHalf, ease: 'sine.inOut', repeat: REP, yoyo: true }, start); break;
            case 'swing3d':  tl.to(node, { skewX: 10 * I, rotation: 3 * I, duration: loopHalf, ease: 'sine.inOut', repeat: REP, yoyo: true }, start); break;
            case 'spin3d':   tl.to(node, { scaleX: -1, duration: loopHalf, ease: 'power1.inOut', repeat: REP, yoyo: true }, start); break;
            case 'flip3d':   tl.to(node, { scaleX: 0, duration: loopHalf, ease: 'power2.inOut', repeat: REP, yoyo: true }, start); break;
            case 'wobble3d': tl.to(node, { skewX: 8 * I, skewY: 6 * I, duration: loopHalf, ease: 'sine.inOut', repeat: REP, yoyo: true }, start); break;
            case 'depth-pop':tl.to(node, { scale: 1 + 0.18 * I, duration: loopHalf, ease: 'sine.inOut', repeat: REP, yoyo: true }, start); break;
            case 'coin3d':   tl.to(node, { scaleX: -1, duration: Math.max(0.2, loopHalf * 0.6), ease: 'none', repeat: REP, yoyo: true }, start); break;
            case 'color-cycle': gsap.set(node, { filter: 'hue-rotate(0deg)' }); tl.to(node, { filter: 'hue-rotate(180deg)', duration: D || dur(1.5), ease: 'sine.inOut', repeat: REP, yoyo: true }, start); break;
            case 'glow':     gsap.set(node, { filter: 'drop-shadow(0 0 0px ' + col + ')' }); tl.to(node, { filter: 'drop-shadow(0 0 ' + (18 * I) + 'px ' + col + ')', duration: loopHalf, ease: 'sine.inOut', repeat: REP, yoyo: true }, start); break;
            case 'vibrate':  tl.fromTo(node, { x: -3 * I }, { x: 3 * I, duration: 0.06, ease: 'none', repeat: Math.min(140, REP * 8), yoyo: true }, start); break;
            // ── exit ──
            case 'slide-out': {
              const vert = (dir === 'top' || dir === 'bottom');
              const at = ((typeof d.startSec === 'number') ? start : Math.max(0, total - dur(1.0)));
              tl.to(node, vert
                ? { y: outY * 200, opacity: 0, duration: D || dur(0.7), ease: 'power2.in' }
                : { x: outX * 200, opacity: 0, duration: D || dur(0.7), ease: 'power2.in' }, at);
              break;
            }
            case 'flip-out': tl.to(node, { scaleX: 0, opacity: 0, duration: D || dur(0.7), ease: 'power2.in' }, ((typeof d.startSec === 'number') ? start : Math.max(0, total - dur(1.0)))); break;
            case 'fade-out': tl.to(node, { opacity: 0, duration: D || dur(0.7), ease: 'power2.in' }, ((typeof d.startSec === 'number') ? start : Math.max(0, total - dur(1.0)))); break;
            case 'scale-out':tl.to(node, { scale: 0.9, opacity: 0, duration: D || dur(0.7), ease: 'power2.in' }, ((typeof d.startSec === 'number') ? start : Math.max(0, total - dur(1.0)))); break;
            default: break;
          }
        }
        if (PLAN && Array.isArray(PLAN.directives)) {
          PLAN.directives.forEach((d) => {
            if (!d || !d.target) return;
            let nodes = [];
            if (d.target === 'all') {
              nodes = svgEl ? Array.from(svgEl.querySelectorAll('[id^="w2panim-"]')) : [];
            } else {
              let n = null;
              try { n = svgEl && svgEl.querySelector('#' + (window.CSS && CSS.escape ? CSS.escape('w2panim-' + d.target) : 'w2panim-' + d.target)); } catch (e) { n = null; }
              if (n) nodes = [n];
            }
            const stag = (typeof d.stagger === 'number' && d.stagger > 0) ? d.stagger : 0; // secondes (non scalées)
            const isExit = d.phase === 'exit';
            const totalSec = w2pTotalSec() / DUR_SCALE; // ~10 s
            nodes.forEach((node, i) => {
              const wrapped = w2pWrap(node);
              let dd = d;
              if (stag) {
                // Entrée : ancre 0 + i·stag. Sortie : cascade calée sur la FIN
                // (dernier élément ~1.2 s avant la fin) → cascade visible, pas de clip.
                const baseSec = (typeof d.startSec === 'number') ? d.startSec
                  : (isExit ? Math.max(0, totalSec - 1.2 - (nodes.length - 1) * stag) : 0);
                dd = Object.assign({}, d, { startSec: Math.min(baseSec + i * stag, totalSec - 0.4) });
              }
              w2pApplyDirective(wrapped, dd);
            });
          });
        }

        window.__timelines = window.__timelines || {};
        window.__timelines['design-reveal-square'] = tl;
      })();
